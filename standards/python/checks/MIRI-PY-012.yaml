# MIRI-PY-012 — generated with the checklist table; canonical source of truth.
id: MIRI-PY-012
name: Version coherence
target: python-wheel
status: active
added_in: 0.1-draft
level: MUST
category: Agent Metadata Core
weight: 3
conditional: false
severity:
  default: HIGH
  violation_unit: each file with a mismatched version
  population_unit: all files in agent-metadata/
short_description: '`sdk_version` in every metadata file equals the wheel version'
long_description: 'The agent-metadata directory is the wheel''s machine-readable surface; every file in it must be present,
  schema-valid, and generated at build time so agents can consume it without parsing or guessing. This check verifies: `sdk_version`
  in every metadata file equals the wheel version.'
rationale: 'PEP 427 binds the version in a wheel''s filename to its dist-info METADATA and pip refuses wheels where the
  two disagree; this check extends the same invariant to the agent-metadata surface. A manifest carrying a different sdk_version
  means the agent is reading API documentation for a release it is not running: the specification''s own migration example
  — execute() renamed to query() in 1.2.0 — shows how a 1.1.0 manifest inside a 1.2.0 wheel directs the agent to call a
  method that no longer exists, and the resulting AttributeError points at the agent''s code, not at the stale metadata
  that caused it.'
fires_when:
- sdk_version in sdk-manifest.json is not exactly (byte-for-byte) equal to the wheel's METADATA Version
- any other agent-metadata file carrying the package version (the @version in lifecycle.json identity.purl, migration-guide.json
  to_version) is not exactly equal to METADATA Version
- version strings are canonically equal but not textually identical (e.g. a 1.2.0 manifest in a 1.2 wheel); this check
  requires exact string equality — matching MIRI-PY-019 — so near-misses still fire
remediation:
- 'Keep one version source: [project] version in pyproject.toml, or dynamic versioning via the build backend''s VCS plugin'
- Have the generator read that source (importlib.metadata.version() against the built package) instead of accepting a version
  argument that can drift
- Assert sdk_version == METADATA Version for every metadata file in CI after `python -m build` and before upload; fail the
  release on any mismatch
examples:
  violation: "example_sdk-1.2.0-py3-none-any.whl:\n  METADATA:            Version: 1.2.0\n  sdk-manifest.json:   \"sdk_version\"\
    : \"1.1.0\"  <- still documents execute(), renamed to query() in 1.2.0\n  lifecycle.json:      \"purl\": \"pkg:pypi/example-sdk@1.1.0\""
  compliant: "example_sdk-1.2.0-py3-none-any.whl:\n  METADATA:            Version: 1.2.0\n  sdk-manifest.json:   \"sdk_version\"\
    : \"1.2.0\"\n  lifecycle.json:      \"purl\": \"pkg:pypi/example-sdk@1.2.0\"\n  (all derived from the single [project]\
    \ version at build time)"
suggested_fix: Derive sdk_version from the single package version source at build time.
references:
