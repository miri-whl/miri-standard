# MIRI-PY-020 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-PY-020
name: Distribution & registry declared
target: python-wheel
status: active
added_in: 0.1-draft
level: MUST
category: Identity & Security
weight: 2
conditional: false
severity:
  default: MEDIUM
  violation_unit: the identity declaration
short_description: '`distribution` set; `registry` a well-formed index URL'
long_description: 'The identity block declares `distribution` as "open-source" or "private" and gives
  `registry` as an absolute http(s) URL of an installable index, never a project page or a placeholder.
  The two declarations agree. A private distribution cannot name https://pypi.org/simple/, and an open-source
  one cannot name an internal-only index.'
rationale: 'The identity.distribution field selects which specification defaults apply: §4 for open source
  or §5 for private. The identity.registry field names the index the artifact is published to. Comparing
  declared origin against actual install origin is the dependency-confusion tell called out in §3.1, and
  registry is the one field that makes that comparison possible. Public OSV queried for a private-only
  name returns an empty result indistinguishable from "not vulnerable" (§5.1). A wheel that leaves distribution
  undeclared therefore defaults its consumers into the one lookup that misleads them. No error reports
  the mistake.'
fires_when:
- identity.distribution is absent or not one of "open-source" / "private"
- identity.registry is absent, not an absolute http(s) URL, or a placeholder value (e.g. "TBD")
- 'the declarations contradict each other: distribution "private" with registry https://pypi.org/simple/, or "open-source"
  with an internal-only index'
- registry points at a project page (e.g. https://pypi.org/project/example-sdk/) rather than an installable index URL
remediation:
- Declare both fields in the Miri build configuration, e.g. [tool.miri.lifecycle] distribution = "open-source",
  registry = "https://pypi.org/simple/"
- For private packages set distribution = "private" and point registry at the internal index, for example
  https://pypi.internal.example/simple/. This is the same URL the purl carries in its repository_url qualifier
  (§5.1)
- Use the installable simple-index URL rather than the project page. Consumers compare it directly against
  pip's actual install origin
examples:
  violation: "lifecycle.json:\n  \"identity\": {\"purl\": \"pkg:pypi/example-internal@3.2.0\"}\n  <- distribution and registry\
    \ absent: a consumer defaults to public OSV for example-internal,\n     an internal-only name, and the empty response reads\
    \ as \"not vulnerable\""
  compliant: "lifecycle.json:\n  \"identity\": {\n    \"purl\": \"pkg:pypi/example-internal@3.2.0?repository_url=https://pypi.internal.example/simple/\"\
    ,\n    \"distribution\": \"private\",\n    \"registry\": \"https://pypi.internal.example/simple/\"\n  }\n  (consumers\
    \ skip public OSV as authoritative and can flag any install not originating from the declared registry)"
suggested_fix: Declare distribution (open-source or private) and the publishing registry URL.
references:
- title: Lifecycle §3.1
  url: lifecycle-security-metadata.md
  type: spec
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/python/checks/MIRI-PY-020.yaml
  html: https://miri-whl.github.io/checks/python/MIRI-PY-020.html
