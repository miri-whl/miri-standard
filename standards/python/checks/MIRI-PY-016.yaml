# MIRI-PY-016 — generated with the checklist table; committee-owned source of truth.
id: MIRI-PY-016
name: Example index coherent
target: python-wheel
status: active
added_in: 0.1-draft
level: MUST
category: Examples
weight: 2
conditional: false
severity:
  default: MINOR
  violation_unit: each index/file mismatch
  population_unit: all entries in AGENT_EXAMPLES.json plus all example files on disk
short_description: '`AGENT_EXAMPLES.json` entries ↔ files on disk, both directions'
long_description: 'Embedded examples are the primary learning path for agents; an example that does not run teaches a wrong
  lesson at machine speed. This check verifies: `AGENT_EXAMPLES.json` entries ↔ files on disk, both directions.'
rationale: AGENT_EXAMPLES.json (Miri Wheel Extensions §4.1) is how agents discover examples without directory-walking; the
  index, not the filesystem, is the contract surface. An entry pointing at a missing file sends every consumer to a dead
  path at machine speed, while an on-disk example with no entry is invisible however good it is. Because the index is build-generated,
  a mismatch in either direction is deterministic evidence of a broken generation pipeline rather than a content judgment
  call.
fires_when:
- an examples[*].file path in AGENT_EXAMPLES.json does not exist in the wheel
- a *.py file under examples/ (excluding __init__.py) has no entry in the index
- learning_paths, categories, prerequisites, or related reference an example id absent from the examples map
remediation:
- Generate AGENT_EXAMPLES.json from a disk scan of examples/ at build time; never edit it by hand
- 'Fail the build on either direction of mismatch: indexed-but-missing file, or on-disk example with no entry'
- 'Validate referential integrity during generation: every id named in learning_paths, categories, prerequisites, and related
  must exist in the examples map'
examples:
  violation: "AGENT_EXAMPLES.json:\n  \"authentication\": {\"file\": \"examples/auth.py\", ...}   <- wheel ships examples/authentication.py,\
    \ not auth.py\nOn disk but unindexed:\n  examples/error_handling.py   <- exists, invisible to any agent reading the\
    \ index"
  compliant: "AGENT_EXAMPLES.json examples map <-> examples/ on disk, one-to-one:\n  \"quickstart\":     {\"file\": \"examples/quickstart.py\"\
    }      -> exists\n  \"authentication\": {\"file\": \"examples/authentication.py\"} -> exists\n  ls examples/: __init__.py\
    \  quickstart.py  authentication.py  (nothing unindexed; all path ids referenced by learning_paths exist)"
suggested_fix: Regenerate the example index from the files on disk.
references:
- title: Miri Wheel Ext. §4.1
  url: miri-wheel-extensions.md
  type: spec
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/python/checks/MIRI-PY-016.yaml
  html: https://miri-whl.github.io/checks/python/MIRI-PY-016.html
