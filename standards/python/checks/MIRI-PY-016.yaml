# MIRI-PY-016 — generated with the checklist table; canonical source of truth.
# WITHDRAWN at 0.6.0. Its both-ways join (index entries <-> files on disk) became MIRI-PY-014's T3 clause and its
# 2 weight moved there, both halves in the same change. Never "absorbed": the ID and this file stay forever, so a
# report or a linter that names MIRI-PY-016 resolves to a definition that says where the obligation went.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-PY-016
name: Example index coherent
target: python-wheel
status: withdrawn
withdrawn_in: 0.6.0-draft
added_in: 0.1-draft
level: MUST
category: Examples
weight: 2
conditional: false
severity:
  default: MINOR
  violation_unit: each index/file mismatch
  population_unit: all entries in AGENT_EXAMPLES.json plus all example files on disk
short_description: '`AGENT_EXAMPLES.json` entries and files on disk match in both directions'
long_description: 'This check was withdrawn in 0.6.0-draft, and its index/file join is now the T3 clause
  of MIRI-PY-014. It required every `examples[*].file` path in AGENT_EXAMPLES.json to exist in the wheel
  and every `*.py` file under examples/ other than `__init__.py` to have an index entry. Every example
  id named in learning_paths, categories, prerequisites, or related had to exist in the examples map.'
rationale: AGENT_EXAMPLES.json (Miri Wheel Extensions §4.1) is how agents discover examples without walking
  directories, and the index is the contract surface they read. An entry pointing at a missing file sends
  every consumer to a dead path at machine speed. An example on disk with no entry stays invisible however
  good it is. Because the build generates the index, a mismatch in either direction is deterministic evidence
  of a broken generation pipeline rather than a content judgment call.
fires_when:
- an examples[*].file path in AGENT_EXAMPLES.json does not exist in the wheel
- a *.py file under examples/ (excluding __init__.py) has no entry in the index
- learning_paths, categories, prerequisites, or related reference an example id absent from the examples map
remediation:
- Generate AGENT_EXAMPLES.json from a disk scan of examples/ at build time; never edit it by hand
- 'Fail the build on either direction of mismatch: indexed-but-missing file, or on-disk example with no entry'
- 'Validate referential integrity during generation: every id named in learning_paths, categories, prerequisites, and related
  must exist in the examples map'
examples:
  violation: "AGENT_EXAMPLES.json:\n  \"authentication\": {\"file\": \"examples/auth.py\", ...}   <- wheel ships examples/authentication.py,\
    \ not auth.py\nOn disk but unindexed:\n  examples/error_handling.py   <- exists, invisible to any agent reading the\
    \ index"
  compliant: "AGENT_EXAMPLES.json examples map <-> examples/ on disk, one-to-one:\n  \"quickstart\":     {\"file\": \"examples/quickstart.py\"\
    }      -> exists\n  \"authentication\": {\"file\": \"examples/authentication.py\"} -> exists\n  ls examples/: __init__.py\
    \  quickstart.py  authentication.py  (nothing unindexed; all path ids referenced by learning_paths exist)"
suggested_fix: Regenerate the example index from the files on disk.
references:
- title: Miri Wheel Ext. §4.1
  url: miri-python-wheel-extensions.md
  type: spec
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/python/checks/MIRI-PY-016.yaml
  html: https://miri-whl.github.io/checks/python/MIRI-PY-016.html
