# MIRI-PY-022 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-PY-022
name: Private-source rule
target: python-wheel
status: active
added_in: 0.1-draft
level: MUST
category: Identity & Security
weight: 3
conditional: false
severity:
  default: HIGH
  violation_unit: the advisory_sources list
short_description: '`distribution: private` does not rely solely on public OSV'
long_description: 'For a `private` distribution, the check requires at least one `osv-internal` or `osv-local`
  advisory source and fails when every entry marked `authoritative: true` is `type: osv` pointing at the public
  OSV endpoint. A distribution that is not `private` passes.'
rationale: 'OSV.dev answers `/v1/query` with an empty object both for a package with no known vulnerabilities and
  for a package it has never heard of. For a name that exists only on an internal index, the public endpoint returns
  a clean result unconditionally and permanently. A private package whose only authoritative source is public OSV
  has disabled its own vulnerability signal while passing every scan. The 2021 dependency-confusion research (Birsan)
  also showed that routing internal package names through public infrastructure discloses them to squatters. For both
  reasons Lifecycle §5.1 forbids treating public OSV as authoritative for `distribution: private` packages.'
fires_when:
- '`identity.distribution` is `private` and every `advisory_sources` entry marked `authoritative: true` is `type: osv` pointing
  at the public OSV endpoint'
- '`identity.distribution` is `private` and no `osv-internal` or `osv-local` source is declared at all'
remediation:
- 'Stand up (or front an existing SCA platform with) an OSV-schema query endpoint serving organization-local records (e.g.
  IDs like `ACME-2026-0001`), and declare it as `{"type": "osv-internal", ..., "authoritative": true}` (§5.2 option 1)'
- 'For air-gapped environments, maintain an offline OSV archive in the per-ecosystem `all.zip` layout and declare it as
  `type: osv-local` (§5.2 option 2)'
- 'Keep public OSV listed with `authoritative: false` so the open-source dependency tree remains covered'
examples:
  violation: "lifecycle.json:\n  \"identity\": {\"purl\": \"pkg:pypi/example-internal@3.2.0?repository_url=https://pypi.internal.example/simple/\"\
    ,\n               \"distribution\": \"private\", ...},\n  \"advisory_sources\": [\n    {\"type\": \"osv\", \"ecosystem\"\
    : \"PyPI\", \"url\": \"https://api.osv.dev/v1/query\", \"authoritative\": true}\n  ]\n# api.osv.dev has never heard\
    \ of example-internal; every query returns {} — read as 'not vulnerable'"
  compliant: "\"advisory_sources\": [\n  {\"type\": \"osv-internal\", \"url\": \"https://osv.internal.example/v1/query\"\
    , \"authoritative\": true},\n  {\"type\": \"osv\", \"ecosystem\": \"PyPI\", \"url\": \"https://api.osv.dev/v1/query\"\
    , \"authoritative\": false}\n]"
suggested_fix: Add the internal OSV endpoint as the authoritative source for private packages.
references:
- title: Lifecycle §5.1
  url: lifecycle-security-metadata.md
  type: spec
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/python/checks/MIRI-PY-022.yaml
  html: https://miri-whl.github.io/checks/python/MIRI-PY-022.html
