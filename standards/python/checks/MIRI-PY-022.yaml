  violation_unit: the advisory_sources list
short_description: '`distribution: private` does not rely solely on public OSV'
long_description: 'Vulnerability and currency verdicts are computed externally by joining declared identity against advisory
  databases; a wheel that misdeclares identity or sources silently breaks that join. This check verifies: `distribution:
  private` does not rely solely on public OSV.'
examples:
  violation: A private package lists only public OSV, so empty results read as 'not vulnerable'
  compliant: The private package lists its internal OSV endpoint as the authoritative source
suggested_fix: Add the internal OSV endpoint as the authoritative source for private packages.
