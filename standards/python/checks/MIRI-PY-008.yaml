# MIRI-PY-008 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-PY-008
name: usage-patterns.json valid
target: python-wheel
status: active
added_in: 0.1-draft
level: MUST
category: Agent Metadata Core
weight: 4
conditional: false
severity:
  default: MEDIUM
  violation_unit: usage-patterns.json failing schema validation (counted per file as 0 or 1 so that counts
    are comparable across validators)
short_description: Present and validates against schema
long_description: 'Passing needs `agent-metadata/usage-patterns.json` with top-level version, generated_at
  and a non-empty `patterns` array. Every pattern carries id, name, description, complexity, category
  and code. A pattern id listed in `categories` or `learning_paths` has to be defined by some pattern.'
rationale: 'Usage patterns exist so agents insert vetted idioms instead of re-deriving them. For that
  reason usage-patterns-v1.json makes id, name, description, complexity, category, and code mandatory
  for every pattern. Other documents key on the id. The usage_patterns arrays in sdk-manifest.json, the
  affected_patterns in migration-guide.json, and prompt templates all reference patterns by id. An entry
  with no stable id or no code body therefore breaks cross-referencing in every file that points at it
  as well as in this one.'
fires_when:
- '`agent-metadata/usage-patterns.json` is absent'
- The top level lacks version, generated_at, or patterns
- A pattern entry lacks any of id, name, description, complexity, category, or code
- '`patterns` is present but an empty array. The two clauses below quantify over the pattern list, so an
  empty one satisfies them vacuously — and usage-patterns.json is the document whose entire value is its
  contents. The standard already says this for advisory sources (MIRI-PY-021, "absent, null, or an empty
  array") and did not say it here. Raised by the miri-py team from scoring five real wheels.'
- A `categories` or `learning_paths` entry lists a pattern id that no pattern defines
remediation:
- Regenerate usage-patterns.json at build time from curated sources (examples/, tests/) per Agent Metadata §5.1
- 'Assign every pattern a stable snake_case id and treat a rename like an API rename: update every referencing file in the
  same change'
- 'Validate before packaging: `check-jsonschema --schemafile usage-patterns-v1.json src/example_sdk/agent-metadata/usage-patterns.json`'
examples:
  violation: "usage-patterns.json:\n{\"version\": \"1.0\", \"generated_at\": \"2026-08-01T12:00:00Z\",\n \"patterns\": [{\"\
    name\": \"Basic connection\",\n               \"description\": \"Connect and query\"}]}\n# the pattern has no id (nothing\
    \ can reference it) and no code (nothing to insert)"
  compliant: "{\"version\": \"1.0\", \"generated_at\": \"2026-08-01T12:00:00Z\",\n \"patterns\": [{\"id\": \"basic_connection\"\
    , \"name\": \"Basic connection\",\n   \"description\": \"Connect and run one query\", \"complexity\": \"beginner\",\n\
    \   \"category\": \"connection\",\n   \"code\": \"from example_sdk import Client\\nclient = Client(dsn)\\nclient.connect()\"\
    }]}"
suggested_fix: Regenerate usage-patterns.json; every pattern needs id and code.
references:
