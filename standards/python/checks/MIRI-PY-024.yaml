# MIRI-PY-024 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-PY-024
name: SBOM when bundling
target: python-wheel
status: active
added_in: 0.1-draft
level: MUST
category: Identity & Security
weight: 4
conditional: true
severity:
  default: HIGH
  violation_unit: the wheel's SBOM state
short_description: Wheels with non-Python components carry `.dist-info/sboms/`
long_description: 'A wheel that contains native extensions, vendored shared libraries, or statically linked
  components carries a `.dist-info/sboms/` directory. Its documents cover every bundled library found
  in the wheel''s file inventory, and RECORD lists them.'
rationale: Vendored native components are the phantom-dependency problem. Scanners working at the `pip` level
  see only dist-info name and version. A wheel that statically bundles OpenSSL exposes real CVEs that no scan
  of the Python surface can find. This happens in ordinary releases. Version 38.0.3 of cryptography re-released
  its wheels solely to bundle OpenSSL 3.0.7 and resolve CVE-2022-3602/3786, and 41.0.4 did the same for OpenSSL
  3.1.3. Throughout, a consumer on the prior wheel showed a clean `pip` inventory. PEP 770 (accepted 2025) closes
  the gap by placing SBOM documents in `.dist-info/sboms/`. Scanners discover them there without any Miri-specific
  pointer. Lifecycle §3.2 makes them mandatory exactly when non-Python components are bundled.
fires_when:
- The wheel contains native extensions or vendored shared libraries (`.so`/`.pyd`/`.dylib` files, an auditwheel-style `<pkg>.libs/`
  directory, statically linked components declared by the build) but no `.dist-info/sboms/` directory
- '`.dist-info/sboms/` exists but its documents cover no component matching a bundled library found in the wheel''s file
  inventory'
- SBOM files are present but unlisted in `RECORD`
remediation:
- Repair the wheel with auditwheel ≥6.5.0 (`auditwheel repair dist/*.whl`), which generates PEP 770 SBOM data for every
  library it grafts into the wheel
- For components auditwheel cannot see (statically linked OpenSSL, Rust/Cargo dependencies in an extension), emit a CycloneDX
  or SPDX document into `.dist-info/sboms/` from the build backend
- Verify each bundled component appears in an SBOM document with a purl, and that `RECORD` lists the SBOM files
examples:
  violation: "unzip -l example_package-2.1.0-cp312-...whl:\n  example_package/_native.cpython-312-x86_64-linux-gnu.so\n\
    \  example_package.libs/libssl-a54bcc32.so.3\n  example_package-2.1.0.dist-info/METADATA\n# no dist-info/sboms/ — the\
    \ bundled OpenSSL is invisible to every scanner"
  compliant: "  example_package.libs/libssl-a54bcc32.so.3\n  example_package-2.1.0.dist-info/sboms/auditwheel.cdx.json\n\
    # auditwheel-generated CycloneDX listing pkg:generic/openssl@3.1.3\n# → scanners join the bundled OpenSSL against its\
    \ CVEs"
suggested_fix: Let auditwheel (>=6.5.0) generate PEP 770 SBOM data, or add it in the build.
references:
