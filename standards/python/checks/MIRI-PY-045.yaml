# MIRI-PY-045 — generated with the checklist table; canonical source of truth.
# Replaces the obligation withdrawn with MIRI-PY-010 at 0.7.3, and carries its 1 weight. The standard stops
# specifying a graph format of its own and asks instead for a precomputed index in a published one, declared
# where a consumer can find it. SHOULD, not MUST: no toolchain produces these for wheels today, and a MUST
# whose expected result is near-universal non-compliance is a MUST nobody treats as real.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-PY-045
name: Precomputed code index declared
target: python-wheel
status: active
added_in: 0.7.3-draft
level: SHOULD
category: Agent Metadata Core
weight: 1
conditional: false
severity:
  default: LOW
  violation_unit: the wheel's code-index state (counted per wheel as 0 or 1, because a wheel either offers
    a discoverable index or does not)
short_description: A precomputed code index ships in the wheel and `sdk-manifest.json` declares where it is
long_description: 'The wheel carries a precomputed code index under `.dist-info/`, listed in RECORD and
  declared by `sdk-manifest.json` `code_index` with its path and a format from the schema''s closed set.
  The declaration lets a consumer discover the index and decide whether it can read it before opening
  it. An index file under `.dist-info/` that no `code_index` declares fails the check. The check does
  not verify that the index covers the public surface. Confirming coverage means decoding the index, and
  the standard declines to require a decoder of every linter for the same reason it declines to require
  one of every consumer. Coverage is a producer obligation in Miri Wheel Extensions §5.5.'
examples:
  violation: |
    greetlib-1.1.0.dist-info/
      RECORD
      scip/index.scip          <- present, 1.4 MB
    sdk-manifest.json: {"api_index": {...}}   <- no `code_index`

    The index is in the wheel and no consumer can discover it: nothing declares the path, nothing
    names the format, and a consumer that does not already expect `.dist-info/scip/index.scip` has
    no reason to look. A carried artifact nobody can find is the same as an absent one.
  compliant: |
    greetlib-1.1.0.dist-info/
      RECORD                   <- lists scip/index.scip with its sha256 and size
      scip/index.scip

    sdk-manifest.json:
      "code_index": {
        "path": ".dist-info/scip/index.scip",
        "format": "scip",
        "reduction": "occurrences-stripped"
      }

    A consumer reads `code_index`, sees a format it can or cannot decode, and falls back to
    `api_index` if it cannot - which is why the declaration matters more than the index.
rationale: 'Coding agents write against the API they were trained on. A benchmark of 270 real API updates
  across eight Python libraries (NumPy, Pandas, SciPy, scikit-learn, JAX, Keras, TensorFlow, PyTorch)
  found that 25.36% of generations ignored the update, 16.4% used only the removed API, and 12.3% mixed
  old and new APIs in one file. Supplying structured API documentation alongside the request raised the
  share of generated code that executes from 42.55% to 66.36%. That was the largest single intervention
  measured. Chain-of-thought prompting moved the same figure by 2.34 points. The study supplied the documentation
  by hand in a prompt. A wheel can ship the same documentation versioned with the code, and nobody has
  to assemble a context. Of those 270 updates, 128 were modifications: symbols that kept their name and
  changed shape. A name-keyed index cannot detect that class at all. It is also the class behind the mixed-API
  failure, because the name still resolves and the call is wrong. A published index format also makes
  a release delta computable from two artifacts instead of declared. MIRI-PY-043 compares signature-level
  identity, and a name set cannot express it. The miri-py team proposed this check after measuring the
  alternatives, and they published the negative result alongside the positive one. Read whole, an index
  costs more tokens than reading the source. Queried for one symbol, it is 22x cheaper. That asymmetry
  is why this check asks for the index to be declared rather than assumed readable.'
fires_when:
- The wheel ships no precomputed code index under `.dist-info/` and `sdk-manifest.json` carries no `code_index`
- '`sdk-manifest.json` `code_index` names a path that is absent from the wheel, or present but unlisted in RECORD'
- '`code_index.format` is outside the closed set the schema declares'
- An index file is present under `.dist-info/` that no `code_index` pointer declares, so a consumer has no
  discoverable way to know it is there or what format it is in
remediation:
- Produce a SCIP index for the package at build time. The standard names the format but not the producer.
  It treats the wheel format and the build backend the same way
- Reduce it before shipping. A full index measured 62% of a 1.87 MB wheel, and the same index with reference
  occurrences removed measured 20%. See Miri Wheel Extensions §5.5 for which sections a consumer needs
- Write the index under `.dist-info/` beside the SBOM documents PEP 770 places there. One convention then
  covers both precomputed artifacts
- Declare it in `sdk-manifest.json` `code_index` with its path and format, and confirm the build listed
  it in RECORD
suggested_fix: Ship a reduced SCIP index under `.dist-info/` and declare its path and format in `code_index`.
references:
- title: Miri Wheel Ext. §5.5
  url: miri-python-wheel-extensions.md
  type: spec
- title: SCIP — Code Intelligence Protocol
  url: https://github.com/sourcegraph/scip
  type: external
- title: 'When LLMs Lag Behind: Knowledge Conflicts from Evolving APIs in Code Generation'
  url: https://arxiv.org/abs/2604.09515
  type: external
- title: PEP 770
  url: https://peps.python.org/pep-0770/
  type: external
