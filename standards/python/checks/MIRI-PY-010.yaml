# MIRI-PY-010 — generated with the checklist table; canonical source of truth.
# WITHDRAWN at 0.7.3 together with the document it validated. api-graph.json carried a name and a kind per
# node and nothing else: no signature, no position, no identity surviving a rename, no way to tell whether a
# symbol changed shape between releases. It was optional, nothing but this SHOULD read it, and the delta
# checks that need structure (030, 043, 044) read sdk-manifest.json's api_index instead. Its 1 weight moved to
# MIRI-PY-045, which asks for a precomputed index in a published format rather than one this standard
# maintains. Never "absorbed": the ID and this file stay forever, so a report or a linter naming MIRI-PY-010
# resolves to a definition that says where the obligation went.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-PY-010
name: api-graph.json valid
target: python-wheel
status: withdrawn
withdrawn_in: 0.7.3-draft
added_in: 0.1-draft
level: SHOULD
category: Agent Metadata Core
weight: 0
conditional: false
severity:
  default: LOW
  violation_unit: api-graph.json failing schema validation (counted per file as 0 or 1 so that counts
    are comparable across validators)
short_description: If present, validates against schema
long_description: 'This check was withdrawn in 0.7.3-draft. It applied only when `agent-metadata/api-graph.json`
  shipped, and then required the file to validate against api-graph-v1.json. Every edge needed `from`,
  `to` and `relationship`, and both edge endpoints and every workflow step had to name components present
  in `nodes`.'
rationale: 'Consumers read `api-graph.json` for relationship reasoning: which classes cooperate and what a workflow
  touches. An agent reasons better from no graph than from a wrong one. To a consumer, an edge whose `from` or `to`
  names a node that does not exist reads the same as a real relationship. The agent then asserts cooperation between
  components that were never connected. The file is optional, and an absent graph degrades gracefully to manifest-only
  reasoning. The check validates only a graph that ships, because only a present graph can mislead.'
fires_when:
- '`agent-metadata/api-graph.json` is present and fails api-graph-v1.json validation (version, nodes, or edges missing)'
- An edge lacks `from`, `to`, or `relationship`, or either endpoint names a key absent from `nodes`
- A workflow's `steps` reference components that appear nowhere in `nodes`
remediation:
- Regenerate the graph in the same build pass that produces sdk-manifest.json. Both files then derive
  from one source scan
- 'Fail the build on dangling references: every edge endpoint and workflow step must resolve to a `nodes`
  key'
- If the graph cannot be generated reliably, omit the file; this check does not fire on absence
examples:
  violation: "api-graph.json:\n{\"version\": \"1.0\",\n \"nodes\": {\"Client\": {\"type\": \"class\"}},\n \"edges\": [{\"\
    from\": \"QueryBuilder\", \"to\": \"Client\", \"relationship\": \"uses\"}]}\n# QueryBuilder is not in nodes — the edge\
    \ asserts a relationship\n# for a component the graph never declares"
  compliant: "{\"version\": \"1.0\",\n \"nodes\": {\"Client\": {\"type\": \"class\"}, \"QueryBuilder\": {\"type\": \"class\"\
    }},\n \"edges\": [{\"from\": \"QueryBuilder\", \"to\": \"Client\", \"relationship\": \"uses\"}]}\n# every edge endpoint\
    \ resolves to a declared node"
suggested_fix: Regenerate api-graph.json or fix the dangling edge.
references:
- title: Agent Metadata §4.5
  url: miri-agent-metadata-specification.md
  type: spec
- title: schema
  url: ../../schemas/api-graph-v1.json
  type: spec
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/python/checks/MIRI-PY-010.yaml
  html: https://miri-whl.github.io/checks/python/MIRI-PY-010.html
