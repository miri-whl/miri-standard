# MIRI-PY-006 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-PY-006
name: agent-metadata/ present
target: python-wheel
status: active
added_in: 0.1-draft
level: MUST
category: Agent Metadata Core
weight: 2
conditional: false
severity:
  default: CRITICAL
  violation_unit: the package
short_description: Directory exists in the package
long_description: 'The built wheel needs an `agent-metadata/` directory inside an import package, confirmed
  against RECORD and the archive listing. The directory holds at least one of the files the specification
  defines (sdk-manifest.json, usage-patterns.json, lifecycle.json, and the others), and each file is readable
  rather than zero-byte or undecodable.'
rationale: 'Wheel Extensions §3.1.2 places agent-metadata/ inside the import package so that a plain `pip
  install` delivers it and `importlib.resources` can read it with no network access. The directory is
  the root of the entire Miri surface. Without it, an agent falls back to reading the README and guessing.
  The usual failure is a packaging one, and it is silent. By default setuptools ships only `*.py` unless
  package-data names the JSON files. Hatchling''s default file selection excludes git-ignored paths, and
  build-time-generated metadata is usually git-ignored. The directory then exists in the repository but
  not in the built wheel, and nothing warns.'
fires_when:
- No `agent-metadata/` directory exists under any import package in the wheel (checked against RECORD and the archive listing)
- The directory exists but contains none of the files the specification defines (sdk-manifest.json, usage-patterns.json,
  lifecycle.json, ...)
- The directory's files are present but unreadable (zero-byte or undecodable)
remediation:
- Run the Miri generation step at build time so `src/<package>/agent-metadata/` is populated before the backend collects
  files
- 'Make the backend include it: setuptools needs `[tool.setuptools.package-data] example_sdk = ["agent-metadata/*.json",
  "agent-metadata/*.md"]`; hatchling needs `[tool.hatch.build] artifacts = ["*/agent-metadata/*"]` because its defaults
  exclude git-ignored generated files'
- 'Verify the built artifact, not the source tree: `unzip -l dist/example_sdk-*.whl | grep agent-metadata/`'
examples:
  violation: 'src/example_sdk/agent-metadata/sdk-manifest.json   # exists in the repo

    unzip -l dist/example_sdk-2.1.0-py3-none-any.whl | grep agent-metadata

    # (no output) — the backend shipped only *.py; every installed copy

    # of the package lacks the directory'
  compliant: "unzip -l dist/example_sdk-2.1.0-py3-none-any.whl\n  example_sdk/agent-metadata/sdk-manifest.json\n  example_sdk/agent-metadata/usage-patterns.json\n\
    \  example_sdk/agent-metadata/lifecycle.json"
suggested_fix: Add the agent-metadata/ directory and generate its files at build time.
references:
- title: Miri Wheel Ext. §3.2
  url: miri-python-wheel-extensions.md
  type: spec
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/python/checks/MIRI-PY-006.yaml
  html: https://miri-whl.github.io/checks/python/MIRI-PY-006.html
