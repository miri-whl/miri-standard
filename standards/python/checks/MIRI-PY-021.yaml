# MIRI-PY-021 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-PY-021
name: Advisory sources present
target: python-wheel
status: active
added_in: 0.1-draft
level: MUST
category: Identity & Security
weight: 2
conditional: false
severity:
  default: HIGH
  violation_unit: the advisory_sources list
short_description: ≥1 entry in `advisory_sources`, valid type and URL
long_description: 'The `advisory_sources` list in lifecycle.json holds at least one entry. Each entry
  has a `type` of `osv`, `osv-internal`, or `osv-local` and a `url` that parses and is no placeholder
  (for `osv-local`, a readable path). At least one entry carries `authoritative: true`.'
rationale: 'The consumer computes every vulnerability verdict in this specification by POSTing the package''s
  purl to a declared OSV-compatible endpoint (§2.1: the package declares sources and the consumer computes
  verdicts). With `advisory_sources` empty there is no endpoint to join against. The security leg of the
  two-question workflow (§7) then evaluates to nothing without any error. Many downstream tools render
  "no sources consulted" the same way as "no known vulnerabilities". The package looks scanned while nothing
  was ever queried.'
fires_when:
- '`advisory_sources` in `agent-metadata/lifecycle.json` is absent, null, or an empty array'
- An entry's `type` is not one of `osv`, `osv-internal`, or `osv-local`
- An entry's `url` fails URL parsing (or, for `osv-local`, names no readable path), or is a placeholder value such as `TODO`
  or an `example.com` host
- 'No entry carries `authoritative: true`'
remediation:
- 'For `distribution: open-source`, declare the public endpoint: `{"type": "osv", "ecosystem": "PyPI",
  "url": "https://api.osv.dev/v1/query", "authoritative": true}`. Per §4.1, build tools SHOULD inject
  this automatically'
- 'For `distribution: private`, declare an internal source per §5.2 (`osv-internal` endpoint or `osv-local`
  archive)'
- Regenerate `lifecycle.json` at build time (§2.4) rather than hand-patching the array
examples:
  violation: "lifecycle.json:\n  \"identity\": {\"purl\": \"pkg:pypi/example-package@2.1.0\", ...},\n  \"advisory_sources\"\
    : [],\n  \"update_check\": {...}\n# consumers skip the OSV join entirely and report the package clean"
  compliant: "lifecycle.json:\n  \"advisory_sources\": [\n    {\"type\": \"osv\", \"ecosystem\": \"PyPI\",\n     \"url\"\
    : \"https://api.osv.dev/v1/query\", \"authoritative\": true}\n  ]"
suggested_fix: Declare at least one OSV-compatible advisory endpoint.
references:
- title: Lifecycle §3.1
  url: lifecycle-security-metadata.md
  type: spec
- title: OSV schema
  url: https://ossf.github.io/osv-schema/
  type: external
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/python/checks/MIRI-PY-021.yaml
  html: https://miri-whl.github.io/checks/python/MIRI-PY-021.html
