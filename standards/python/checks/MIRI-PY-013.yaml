# MIRI-PY-013 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-PY-013
name: JSON hygiene
target: python-wheel
status: active
added_in: 0.1-draft
level: MUST
category: Agent Metadata Core
weight: 2
conditional: false
severity:
  default: MEDIUM
  violation_unit: each malformed file
  population_unit: all files in agent-metadata/
short_description: All metadata files parse as strict UTF-8 JSON (no NaN/Infinity, no comments)
long_description: 'The agent-metadata JSON files pass a strict RFC 8259 parse. Their bytes are valid UTF-8
  with no byte-order mark, and their text contains no NaN, Infinity or -Infinity tokens, comments, trailing
  commas, or single-quoted strings.'
rationale: RFC 8259 §6 forbids NaN and Infinity tokens, and §8.1 requires UTF-8 for JSON exchanged between systems.
  Python's json.dump emits NaN by default (allow_nan=True). One unscrubbed float('nan') yields a file that the build
  wrote without complaint and that JSON.parse, serde_json, and Go's encoding/json all reject. Because a strict parser
  fails the whole document, a single bad token degrades the consumer from full metadata to none. Nothing in the
  package's own toolchain reports that downgrade.
fires_when:
- any agent-metadata/*.json fails a strict RFC 8259 parse (json.loads with parse_constant configured to raise)
- a file contains NaN, Infinity, or -Infinity tokens
- a file contains // or /* comments, trailing commas, or single-quoted strings
- the file bytes are not valid UTF-8, or begin with a byte-order mark
remediation:
- Serialize with json.dump(data, fh, allow_nan=False, ensure_ascii=False) to a file opened with encoding='utf-8'
  (no BOM)
- Scrub non-finite floats at the source (convert them to null or drop the field) so that allow_nan=False
  raises at build time instead of shipping the token
- 'Re-parse every file in CI with a strict parser (json.loads plus parse_constant=lambda c: raise) to
  catch output from any lenient tool in the pipeline before packaging'
examples:
  violation: "usage-patterns.json as shipped:\n  {\n    \"patterns\": [{\"id\": \"basic\", \"estimated_seconds\": NaN}],\
    \  // TODO: measure\n  }\n  Python wrote it (allow_nan default); JSON.parse and serde_json reject the entire file: metadata\
    \ silently gone for those consumers"
  compliant: "Every agent-metadata file passes strict validation in CI:\n  python3 -c \"import json,sys; json.loads(open(sys.argv[1],\
    \ encoding='utf-8').read(),\n      parse_constant=lambda c: (_ for _ in ()).throw(ValueError(c)))\" agent-metadata/usage-patterns.json\n\
    \  UTF-8 throughout, no NaN/Infinity, no comments, no trailing commas"
suggested_fix: 'Emit strict RFC 8259 JSON: UTF-8, no NaN/Infinity, no comments.'
references:
- title: RFC 8259
  url: https://datatracker.ietf.org/doc/html/rfc8259
  type: external
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/python/checks/MIRI-PY-013.yaml
  html: https://miri-whl.github.io/checks/python/MIRI-PY-013.html
