# MIRI-PY-029 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-PY-029
name: Inventory derived
target: python-wheel
status: active
added_in: 0.1-draft
level: MUST
category: Deprecation & Lifecycle Coherence
weight: 3
conditional: true
severity:
  default: HIGH
  violation_unit: each marker missing from the inventory
  population_unit: all PEP 702-marked interfaces in the package
short_description: Every PEP 702 marker appears in `migration-guide.json` `deprecations`
long_description: 'An interface that carries a PEP 702 marker has a matching entry in migration-guide.json
  `deprecations`, and the entry''s `replacement` and `removal_version` agree with the decorator message.'
rationale: 'PEP 702 markers are discoverable only by importing or type-checking the code, while agents
  and scanners read metadata (§6.2). A marker that never reaches `migration-guide.json` splits the audience.
  Developers in IDEs see the strikethrough, and every metadata-reading consumer keeps recommending the
  deprecated interface up until the release that removes it. Lifecycle §6.2 therefore makes the decorators
  the single source of truth and requires the JSON inventory to be derived at build time. Hand-maintained
  inventories drift in this direction because adding a decorator and updating a JSON file are two edits
  that nothing forces to happen together.'
fires_when:
- An interface carrying a PEP 702 marker has no matching entry in the `deprecations` array of `migration-guide.json`
- A matching entry exists but its `replacement` or `removal_version` contradicts the decorator message
remediation:
- Extract markers mechanically at build time. PEP 702 sets `__deprecated__` on decorated objects, and
  an import-time walk (or an AST scan for the decorator) yields the complete set
- Emit the `deprecations` array (`deprecated`, `replacement`, `removal_version`, `migration`) from that
  extraction in the same build step that writes the other agent metadata
- Fail the build on any marker/inventory mismatch; never hand-edit the generated file
examples:
  violation: "code:  @deprecated(\"Use query() instead; removed in 3.0.0\")\n       def old_query(sql: str): ...\n\
    migration-guide.json:  \"deprecations\": []\n# metadata consumers keep suggesting old_query() until 3.0.0 deletes\
    \ it"
  compliant: "\"deprecations\": [{\n  \"deprecated\": \"old_query\", \"replacement\": \"query\",\n  \"removal_version\"\
    : \"3.0.0\", \"migration\": \"query() accepts the same SQL string\"\n}]  # generated at build time from the\
    \ PEP 702 marker"
suggested_fix: Derive the deprecations array from PEP 702 markers at build time.
references:
- title: Lifecycle §6.2/§6.4-1
  url: lifecycle-security-metadata.md
  type: spec
- title: PEP 702
  url: https://peps.python.org/pep-0702/
  type: external
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/python/checks/MIRI-PY-029.yaml
  html: https://miri-whl.github.io/checks/python/MIRI-PY-029.html
