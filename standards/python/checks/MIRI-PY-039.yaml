# MIRI-PY-039 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-PY-039
name: Prompt templates valid
target: python-wheel
status: active
added_in: 0.1-draft
level: SHOULD
category: Discovery & Degradation
weight: 1
conditional: false
severity:
  default: LOW
  violation_unit: the prompt-templates file
short_description: '`prompt-templates.md`, if present, follows the specified structure'
long_description: 'The check applies when `prompt-templates.md` ships. The file has to follow the §4.4
  structure (Quick Start Prompts with code-generation, debugging, and migration templates) and cite only
  metadata files the wheel ships. It has to use one placeholder syntax throughout and hold declarative
  prompt text with no commands or imperative instructions for the agent to run.'
rationale: 'The prompt-templates.md file provides prompt scaffolds that an agent fills in and reads as
  data rather than as operating instructions (Lifecycle §9.4). Agent Metadata §4.4 defines its structure:
  Quick Start Prompts for code generation, debugging, and migration, each cross-referencing the shipped
  metadata files by name (usage-patterns.json pattern IDs, sdk-manifest.json signatures, migration-guide.json).
  An integration that loads the file substitutes the `{placeholders}` and follows those references mechanically.
  A file that lacks the expected sections, or cites metadata the wheel does not ship, degrades the very
  integrations that opted into it. The file is optional, and the check applies only when it is present.'
fires_when:
- '`prompt-templates.md` is present but lacks the §4.4 section structure (Quick Start Prompts with code-generation, debugging,
  and migration templates)'
- A template references a metadata file the wheel does not ship (e.g. cites migration-guide.json on a first release, or api-graph.json, withdrawn at 0.7.3)
- Placeholder syntax is inconsistent within the file, defeating mechanical substitution
- The file embeds executable commands or imperative instructions for the agent to run (e.g. `curl … | bash`, `rm -rf`,
  a `pip install` of an arbitrary URL) rather than declarative prompt templates
remediation:
- Structure the file per Agent Metadata Specification §4.4, keeping the three Quick Start template categories
- Derive the metadata-file references from the wheel's actual contents so that a template never cites
  an absent file
- Validate the heading structure and reference targets in CI alongside the JSON schema checks
- 'Keep templates declarative: placeholder-filled prompt text only, never shell commands or instructions
  the agent is expected to execute (Lifecycle §9.4)'
examples:
  violation: '# prompt-templates.md

    ## Tips

    Just read the README before using this package.

    # no Quick Start Prompts section; no reference to usage-patterns.json or sdk-manifest.json'
  compliant: '# Agent Prompt Templates

    ## Quick Start Prompts

    ### For Code Generation

    Generate code using weather-sdk to {task_description}.

    Use the "{pattern_id}" pattern from usage-patterns.json; follow signatures in sdk-manifest.json.'
suggested_fix: Follow the structure in the Agent Metadata Specification §4.4.
