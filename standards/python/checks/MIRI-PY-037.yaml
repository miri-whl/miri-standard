# MIRI-PY-037 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-PY-037
name: Embedded docs present
target: python-wheel
status: active
added_in: 0.1-draft
level: SHOULD
category: Discovery & Degradation
weight: 2
conditional: false
conformance_tier: T1
tiers:
  T0:
  - '`docs/api_reference.md` and `docs/troubleshooting.md` exist and are not stubs (non-zero length, at least one heading with body content)'
  T1:
  - 'Every fenced `python` block in both files parses (`ast.parse`), and every import and dotted package path inside those blocks resolves in the wheel or in `api_index` — a block that is syntactically valid but names a module the wheel does not ship is a lie, and lies fail the MUST boundary of a document that is otherwise thin'
  - 'Every identifier-shaped reference in prose that is backtick-quoted and rooted at the package name resolves in `api_index`'
  T2:
  - '`api_reference.md` mentions at least the calibrated floor of `api_index` keys; a mention counts only inside a document whose code blocks clear T1 (weightless until `t2_activation` is met)'
  T3:
  - 'No documented symbol is absent from the current release''s `api_index`, and any version string the docs name for the package equals the wheel''s version'
severity:
  default: LOW
  violation_unit: the docs directory
short_description: '`docs/` directory with API reference and troubleshooting'
long_description: 'Miri metadata must be discoverable at runtime and must never make the package worse for non-Miri consumers.
  This check verifies: `docs/` directory with API reference and troubleshooting.'
rationale: 'Embedded docs are the delivery channel for the environments the standard''s private-distribution story targets:
  an agent sandbox or air-gapped network that can `pip install` from an internal index but has no route to a hosted docs
  site receives exactly what the wheel carries and nothing else. §5.3 names the two files that make a package self-sufficient
  there — `api_reference.md` for what the API is, `troubleshooting.md` for what to do when it misbehaves — because those
  are the two lookups agents otherwise perform against the open web. Generating both from the same source as the hosted
  documentation costs one build step and prevents divergence.'
fires_when:
- The installed package contains no `docs/` directory
- '`docs/` exists but lacks `api_reference.md` or `troubleshooting.md`'
- Either file is a stub — zero-length or headings with no body content
remediation:
- Generate `docs/api_reference.md` and `docs/troubleshooting.md` at build time from the same source as the external documentation
  (Sphinx with a markdown builder, or `mkdocs build`), never as hand-maintained copies
- Include the directory as package data so it ships inside the wheel
- 'Assert presence against the artifact in CI: `unzip -l dist/*.whl | grep docs/api_reference.md`'
examples:
  violation: '$ unzip -l weather_sdk-1.2.0-py3-none-any.whl | grep docs/

    (no output)

    # README points at https://docs.example.com — unreachable from the air-gapped index this wheel is served from'
  compliant: 'weather_sdk/docs/

    ├── api_reference.md      # generated from the Sphinx source at build time

    └── troubleshooting.md    # same error catalog as the hosted site, readable offline'
suggested_fix: Embed api_reference.md and troubleshooting.md in the package.
references:
- title: Miri Wheel Ext. §5.3
  url: miri-python-wheel-extensions.md
  type: spec
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/python/checks/MIRI-PY-037.yaml
  html: https://miri-whl.github.io/checks/python/MIRI-PY-037.html
