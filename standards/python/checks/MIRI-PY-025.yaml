# MIRI-PY-025 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-PY-025
name: SBOM purls resolvable
target: python-wheel
status: active
added_in: 0.1-draft
level: SHOULD
category: Identity & Security
weight: 1
conditional: true
severity:
  default: MINOR
  violation_unit: each malformed SBOM purl
  population_unit: all components in the PEP 770 SBOM documents
short_description: SBOM component purls are well-formed
long_description: 'Each SBOM component in `.dist-info/sboms/` carries a purl that parses under the purl
  specification grammar.'
rationale: SBOM components join against advisory and end-of-life data by purl (§3.2). Scanners normalize each
  component identifier and query with it. Matching tools skip what they cannot normalize. A component whose identifier
  fails purl parsing raises no error and drops out of every scan without a trace. Meanwhile the SBOM's presence
  makes the wheel look fully covered. One malformed purl reopens the phantom-dependency gap that MIRI-PY-024 closes.
fires_when:
- Any component in a `.dist-info/sboms/` document lacks a purl
- Any component purl fails parsing under the purl specification grammar (`pkg:` scheme, type, name, optional version and
  qualifiers)
remediation:
- 'Generate purls with a purl library (`packageurl-python`: `PackageURL(type="generic", name="openssl", version="3.1.3").to_string()`)
  rather than string formatting'
- Add a CI step that round-trips every SBOM component identifier through `PackageURL.from_string()` and fails the build
  on a parse error
examples:
  violation: "sboms/vendored.cdx.json component:\n  {\"name\": \"openssl\", \"purl\": \"openssl 3.1.3\"}\n# not a purl;\
    \ scanners skip the component — OpenSSL is unscanned again"
  compliant: '  {"name": "openssl", "purl": "pkg:generic/openssl@3.1.3"}

    # parses; joins against OSV affected ranges and endoflife.date EoL data'
suggested_fix: Emit valid purls for every SBOM component.
references:
- title: PEP 770
  url: https://peps.python.org/pep-0770/
  type: external
- title: purl spec
  url: https://github.com/package-url/purl-spec
  type: external
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/python/checks/MIRI-PY-025.yaml
  html: https://miri-whl.github.io/checks/python/MIRI-PY-025.html
