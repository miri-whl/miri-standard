# MIRI-PY-030 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-PY-030
name: No silent removals
target: python-wheel
status: active
added_in: 0.1-draft
level: MUST
category: Deprecation & Lifecycle Coherence
weight: 4
conditional: true
requirements:
- previous-release
severity:
  default: CRITICAL
  violation_unit: each silently removed interface
  population_unit: all public interfaces removed since the previous release
short_description: Every public interface removed since the prior release was listed in an earlier release's `deprecations`
long_description: 'The check compares against the previous release. Every public interface present in
  the previous `sdk-manifest.json` and absent from the current one has to appear in an earlier release''s
  migration-guide.json `deprecations`.'
rationale: A silent removal converts every dependent from working to broken with no machine-readable warning.
  The first signal any consumer receives is `AttributeError` in production, and agents working from frozen model
  weights keep generating calls to the vanished interface indefinitely. The reference incident is kubectl's
  `--export` flag. It was deprecated in v1.14 and removed in v1.18. At removal it still broke CI pipelines and
  resource-cloning scripts, because the deprecation lived in a human-readable warning that no automation consumed.
  A removal with no deprecation trail at all breaks the same consumers with even less warning. Lifecycle §6.4-2
  exists because no ecosystem tool checks this. API-diff tools detect the removal but never cross-check it against
  declared deprecations.
fires_when:
- A public interface present in the previous release's `sdk-manifest.json` is absent from the current release's
- That interface appears in no earlier release's `migration-guide.json` `deprecations` array
remediation:
- Reinstate the interface in a patch release; the removal shipped without its contract
- 'Deprecate it properly: PEP 702 marker naming replacement and `removal_version` (MIRI-PY-028), derived
  inventory entry (MIRI-PY-029), and a grace period of at least two releases per the PEP 387 policy shape'
- Remove it only in the announced version. Gate releases on the §6.4-2 coherence check in CI so that the
  diff against the previous release runs before publish rather than after
examples:
  violation: '1.9.0 sdk-manifest.json:  functions: ["execute", "query", "connect"]

    2.0.0 sdk-manifest.json:  functions: ["query", "connect"]

    # execute() gone; no release''s deprecations array ever listed it —

    # callers learn via AttributeError: module has no attribute ''execute'''
  compliant: '1.8.0: @deprecated("Use query() instead; removed in 2.0.0") + deprecations entry

    1.8.x–1.9.x: execute() works, warns, for two minor releases

    2.0.0: execute() removed; the removal matches its announced removal_version'
suggested_fix: 'Deprecate first: marker + inventory entry + grace period, then remove.'
references:
- title: Lifecycle §6.4-2
  url: lifecycle-security-metadata.md
  type: spec
- title: PEP 387
  url: https://peps.python.org/pep-0387/
  type: external
- title: PEP 702
  url: https://peps.python.org/pep-0702/
  type: external
