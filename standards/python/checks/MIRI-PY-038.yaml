# MIRI-PY-038 — generated with the checklist table; canonical source of truth.
id: MIRI-PY-038
name: Templates coherent
target: python-wheel
status: active
added_in: 0.1-draft
level: SHOULD
category: Discovery & Degradation
weight: 2
conditional: false
severity:
  default: LOW
  violation_unit: each index/template mismatch
  population_unit: all entries in TEMPLATES.json plus all template files on disk
short_description: '`TEMPLATES.json` entries ↔ template files; placeholders documented'
long_description: 'Miri metadata must be discoverable at runtime and must never make the package worse for non-Miri consumers.
  This check verifies: `TEMPLATES.json` entries ↔ template files; placeholders documented.'
rationale: 'Templates are copied verbatim into consumer projects, so their defects replicate: an index entry pointing at
  a file the wheel does not contain breaks scaffolding at the moment of use, and a token that appears in a template body
  but not in its `placeholders` map ships as a literal `YOUR_API_KEY`-style string into generated code — failing at runtime
  or getting committed as-is. The §4.4 schema exists so agents can substitute placeholders mechanically; every token the
  map omits is a substitution the agent cannot perform. Coherence is verified in both directions, like the example index
  (MIRI-PY-016).'
fires_when:
- A `templates.<id>.file` path in TEMPLATES.json has no corresponding file in the installed package
- A file under `templates/` (other than `__init__.py`) has no TEMPLATES.json entry
- A placeholder token occurring in a template body is absent from that entry's `placeholders` map, or a mapped placeholder
  lacks `description` or `example`
remediation:
- Generate TEMPLATES.json from the `templates/` directory at build time rather than maintaining the index by hand
- Scan template bodies for placeholder tokens during the build and fail when any token is missing from the `placeholders`
  map
- Validate the index against `templates-v1.json` in CI alongside the other schema checks
examples:
  violation: "TEMPLATES.json:\n  \"basic_client\": {\"file\": \"templates/basic_client.py\", \"placeholders\": {\"API_KEY\"\
    : {...}}}\ntemplates/basic_client.py:\n  client = WeatherClient(api_key=\"API_KEY\", region=\"REGION_CODE\")\n# REGION_CODE\
    \ undocumented — ships literally into consumer code; templates/async_client.py exists on disk but is unindexed"
  compliant: "TEMPLATES.json documents every token found in the template body:\n  \"placeholders\": {\n    \"API_KEY\":\
    \     {\"description\": \"Weather API key\", \"example\": \"wk_live_abc123\", \"required\": true},\n    \"REGION_CODE\"\
    : {\"description\": \"ISO region for the endpoint\", \"example\": \"us-east\", \"required\": false}}\n# and every file\
    \ under templates/ has exactly one index entry"
suggested_fix: Regenerate the template index; document every placeholder.
references:
- title: Miri Wheel Ext. §4.4
  url: miri-wheel-extensions.md
  type: spec
urls:
