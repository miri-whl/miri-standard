# MIRI-PY-044 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-PY-044
name: Dangling claim
target: python-wheel
status: active
added_in: 0.6.0-draft
level: MUST
category: Deprecation & Lifecycle Coherence
weight: 2
conditional: true
severity:
  default: MEDIUM
  violation_unit: each symbol named in changelog.json that resolves in neither release
  population_unit: all symbols named in changelog.json
short_description: 'Every symbol named in `changelog.json` resolves in the current or previous `api_index` (*conditional*:
  document present)'
long_description: 'Names in the `symbols` arrays of `changelog.json` resolve in the current release''s
  `sdk-manifest.json` `api_index`. When the previous release is available, names under `removed` and `deprecated`
  can resolve in its index instead. A symbol that resolves in neither documents something the artifact
  does not carry, and an agent will try to call it.'
rationale: MIRI-PY-031 already catches a replacement that points into nothing. This check catches the
  same defect arriving through the changelog. No previous release is needed to confirm that a name resolves
  in the current release. The join is therefore decidable from the wheel alone, and the check is conditional
  only on the document shipping. The previous-release arm widens the check so that a removal entry can
  be true. The check does not need it in order to run.
fires_when:
- A `symbols` entry under `added`, `changed` or `fixed` names a path with no matching key in the current release's `api_index`
- A `symbols` entry under `removed` or `deprecated` names a path with no matching key in the current release's `api_index`
  AND, where the previous release is available, none in the previous release's either
remediation:
- Validate every `symbols` entry against api_index during changelog assembly. A fragment naming an unknown
  symbol should fail at that point instead of shipping
- Name symbols as the dotted public path api_index uses (`Client.fetch`), never as prose
examples:
  violation: 'changelog.json: added: [{"summary": "Batch fetch", "symbols": ["Client.batch_fetch"]}]

    api_index keys: Client, Client.fetch, Client.batch   # batch_fetch was renamed before release; the changelog points at
    nothing'
  compliant: 'changelog.json: added: [{"summary": "Batch fetch", "symbols": ["Client.batch"]}]

    api_index keys: Client, Client.fetch, Client.batch   # every named symbol resolves'
suggested_fix: Validate changelog symbols against api_index at assembly time.
references:
- title: Agent Metadata §4.7
  url: miri-agent-metadata-specification.md
  type: spec
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/python/checks/MIRI-PY-044.yaml
  html: https://miri-whl.github.io/checks/python/MIRI-PY-044.html
