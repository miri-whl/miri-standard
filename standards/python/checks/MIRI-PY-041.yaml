# MIRI-PY-041 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-PY-041
name: changelog.json valid
target: python-wheel
status: active
added_in: 0.6.0-draft
level: MUST
category: Agent Metadata Core
weight: 3
conditional: true
severity:
  default: HIGH
  violation_unit: changelog.json failing schema validation (counted per file as 0 or 1 so that counts
    are comparable across validators)
short_description: Present for any non-initial release; validates against changelog-v1.json (*conditional*)
long_description: 'From the second release on, the wheel ships `agent-metadata/changelog.json`. The document
  validates against changelog-v1.json and lists `releases` newest-first by PEP 440 version. It is conditional
  in the same way as MIRI-PY-009. A first release has nothing to describe, and requiring the document
  unconditionally would force it to ship an empty one. The freshness contract treats such empty artifacts
  as defects.'
rationale: 'The wheel metadata set records breaking changes in migration-guide.json. Without changelog.json
  it has no place for what was fixed. The check comes from an incident in which a maintainer shipped bug
  fixes with a silent changelog. The downstream project that had reported those bugs installed the fix
  and never learned of it. Every shipped document was present, schema-valid, and stamped in the build
  window. No existing check could see the gap. Agent Metadata §4.7 defines the document. This check covers
  its presence and shape, and MIRI-PY-042 to 044 are the joins that give it meaning.'
fires_when:
- A previous release exists (the linter can establish one — MIRI-PY-030's condition) and `agent-metadata/changelog.json` is
  absent from the wheel
- The document is present and fails validation against changelog-v1.json — `schema_version` not `"1"`, `releases` empty, an
  entry without `summary`, an unknown key anywhere
- '`releases` is not ordered newest-first by PEP 440 version'
remediation:
- Assemble `changelog.json` at build time from per-change fragments (towncrier-class tooling). A change
  lands with a fragment or CI fails, and the release build assembles the document
- 'Validate before packaging: `check-jsonschema --schemafile changelog-v1.json src/example_sdk/agent-metadata/changelog.json`'
- Keep `deprecated` and `removed` entries in agreement with migration-guide.json; it remains the authoritative
  lifecycle record
examples:
  violation: "Wheel 1.2.0 agent-metadata/:\n  sdk-manifest.json  usage-patterns.json  migration-guide.json  lifecycle.json\n\
    \  # 1.1.0 exists on the index; no changelog.json — what 1.2.0 fixed is unrecorded"
  compliant: "agent-metadata/changelog.json:\n  {\"schema_version\": \"1\", \"releases\": [\n    {\"version\": \"1.2.0\",\
    \ \"fixed\": [{\"summary\": \"Timeout ignored under TLS\", \"refs\": [\"#408\"]}]},\n    {\"version\": \"1.1.0\", \"added\"\
    : [{\"summary\": \"Batch fetch\", \"symbols\": [\"Client.batch\"]}]}]}"
suggested_fix: Generate changelog.json from change fragments at build time; validate against changelog-v1.json.
references:
- title: Agent Metadata §4.7
  url: miri-agent-metadata-specification.md
  type: spec
- title: schema
  url: ../../schemas/changelog-v1.json
  type: spec
- title: PEP 440
  url: https://peps.python.org/pep-0440/
  type: external
