# MIRI-CLI-019 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-CLI-019
name: Distribution declared
target: cli
status: active
added_in: 0.1-draft
level: MUST
category: Identity & Introspection
weight: 1
conditional: false
severity:
  default: LOW
  violation_unit: the identity declaration
short_description: '`identity.distribution` is `open-source` or `private`'
long_description: The check reads `identity.distribution` from `--describe` and fails when the field is absent or holds
  anything other than the exact string "open-source" or "private". Scanners need the value to decide whether the CLI Spec
  §4 rule on empty public-OSV results applies.
rationale: The declaration selects which security defaults apply. OSV's /v1/query returns an empty result both
  when a package is known and clean and when the database has never heard of the name. For a private CLI, an
  empty public-OSV response means only that OSV has no record of the name. CLI Spec §4 forbids treating it as
  "not vulnerable" unless public OSV is explicitly listed. A scanner can apply that rule only if the artifact
  states which population it belongs to. An undeclared distribution defaults private tools into a false clean
  bill.
fires_when:
- '`identity.distribution` is absent from --describe'
- Its value is anything other than the exact strings "open-source" or "private"
remediation:
- Declare `distribution` in the build-time identity block beside the version and purl constants; the value is a property
  of the build and does not vary per install
- For "private", pair the declaration with an osv-internal or osv-local advisory source (§8.2) so the §4 empty-result rule
  has an authoritative source to defer to
examples:
  violation: '"identity": {"purl": "pkg:generic/acme/acme-cli@3.2.0"}

    # no distribution: a scanner cannot tell whether an empty public-OSV result means clean or merely unknown'
  compliant: "\"identity\": {\"purl\": \"pkg:generic/acme/acme-cli@3.2.0?repository_url=https://releases.acme.example\"\
    ,\n  \"distribution\": \"private\"}"
suggested_fix: Declare open-source or private.
references:
- title: CLI Spec §3.1
  url: cli-lifecycle-specification.md
  type: spec
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/cli/checks/MIRI-CLI-019.yaml
  html: https://miri-whl.github.io/checks/cli/MIRI-CLI-019.html
