# MIRI-CLI-042 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-CLI-042
name: Safe retries
target: cli
status: active
added_in: 0.1-draft
level: SHOULD
category: Safety
weight: 2
conditional: false
severity:
  default: MINOR
  violation_unit: each unsafe retry path
  population_unit: all mutating commands in --describe
short_description: Mutations support idempotency keys or optimistic-lock version guards
long_description: At least one mutating command in `--describe` has to accept an idempotency key or an optimistic-lock version
  guard. Two identical creates have to yield one resource, and repeating a call with the same key has to return the original
  result. A conflicting concurrent update has to produce a distinct exit code or a structured conflict error.
rationale: Agents retry on timeout as a matter of course. Without protection, a retried create duplicates the resource and
  a retried update clobbers a concurrent change (the classic lost update). Stripe's `Idempotency-Key` is the canonical design.
  The server stores the first outcome per key for at least 24 hours and replays it on retry. A network-failed charge can
  then be resent without charging twice. The desk tool carries the same mechanism into CLI form with `--idempotency-key`.
  A retried desk command is a safe no-op that returns the original result. Docker's Agent CLI supplies the complementary
  guard for updates. Its mutations require `--expected-version <n>` (an optimistic lock; a version conflict exits 3) or
  an explicit `--force`.
fires_when:
- No mutating command in `--describe` accepts an idempotency key or an optimistic-lock version guard
- 'Behavioral evidence: running an identical create twice yields two resources, or repeating a call with the same key does
  not return the original result'
- Updates apply unconditionally — no `--expected-version` equivalent exists, and a conflicting concurrent write produces
  no distinct exit code or structured conflict error
remediation:
- Accept `--idempotency-key <key>` on create-shaped mutations; persist the first outcome keyed by it for a bounded window
  (Stripe prunes keys after 24 hours) and replay the stored result on reuse
- 'Accept `--expected-version <n>` on update-shaped mutations; on mismatch, exit with a distinct code (Docker uses 3) and
  a structured conflict error carrying `retryable: false`'
- Declare in `--describe` which commands support keys and guards, as desk's `--capabilities` does; a harness then knows
  before its first call which retries are safe
examples:
  violation: '$ tool create-webhook --url https://x.example    # times out at the client; the agent retries

    $ tool create-webhook --url https://x.example

    $ tool list-webhooks --json | jq length

    2 — both endpoints registered, both now firing on every event'
  compliant: '$ tool create-webhook --url https://x.example --idempotency-key 7f3a-...

    {"id": "wh_1", "created": true}

    $ tool create-webhook --url https://x.example --idempotency-key 7f3a-...

    {"id": "wh_1", "created": true}   # replayed original result; one webhook exists'
suggested_fix: Support idempotency keys or optimistic-lock version guards.
references:
- title: Landscape §2.3 (desk) / §2.4 (Docker)
  url: landscape-and-prior-art.md
  type: spec
