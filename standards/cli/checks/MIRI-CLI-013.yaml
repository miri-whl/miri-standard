# MIRI-CLI-013 — generated with the checklist table; canonical source of truth.
id: MIRI-CLI-013
name: Structured errors
target: cli
status: active
added_in: 0.1-draft
level: MUST
category: Machine Output
weight: 3
conditional: false
severity:
  default: HIGH
  violation_unit: each unstructured failure
  population_unit: all commands in --describe
short_description: Failures emit JSON with a stable machine `error.code`
long_description: 'Agents parse stdout; anything unstructured, inconsistent, or polluted forces guesswork and burns recovery
  turns. This check verifies: Failures emit JSON with a stable machine `error.code`.'
rationale: 'CLI Spec §6 makes the machine code the one stable surface of a failure: prose wording is free to change between
  releases, so an agent that branches on message text breaks silently the first time a sentence is reworded. The precedent
  is settled API practice — AWS service errors carry machine codes such as ThrottlingException that SDK retry classifiers
  branch on, and RFC 9457 separates the stable problem `type` from the human `detail` field consumers are told not to parse.
  A failure that emits only prose and a bare non-zero exit is the dead end of landscape §3.3: the agent retries with hallucinated
  variants until something works, and no bug report is ever filed.'
fires_when:
- An induced failure exits non-zero with prose only — no JSON error payload on the machine channel
- 'The error payload lacks `error.code`, or lacks `ok: false`, on a failing invocation'
- Error codes appear nowhere in the documented wire contract, leaving message text as the only branching surface
- The same induced failure yields an `error.code` different from the documented one
remediation:
- 'Emit {"schema_version": "1", "ok": false, "error": {"code": ...}} as JSON on the machine channel for every failure path, per CLI Spec §6'
- 'Assign UPPER_SNAKE codes from a closed, documented set (AUTH_EXPIRED, FLAG_REMOVED, RESOURCE_NOT_FOUND) and treat the
  set as API: codes are added, never repurposed or renumbered'
- Keep the human explanation in a separate message field that may change freely; keep warnings on stderr so they never corrupt
  the payload (§2.5)
- Route removed-surface invocations through the structured FLAG_REMOVED teaching error of §6 rather than the argument parser's
  generic failure
examples:
  violation: '$ acme deploy --export

    Error: unrecognized arguments: --export

    $ echo $?

    2   # prose only; nothing an agent can branch on survives a rewording'
  compliant: "$ acme deploy --export\n{\"schema_version\": \"1\", \"ok\": false, \"error\": {\"code\": \"FLAG_REMOVED\", \"flag\": \"--export\",\n\
    \  \"removed_in\": \"1.18.0\", \"retryable\": false,\n  \"suggestions\": [\"use --output archive instead\"]}}"
suggested_fix: Emit structured errors with a stable machine error.code.
references:
- title: CLI Spec §6
  url: cli-lifecycle-specification.md
  type: spec
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/cli/checks/MIRI-CLI-013.yaml
  html: https://miri-whl.github.io/checks/cli/MIRI-CLI-013.html
