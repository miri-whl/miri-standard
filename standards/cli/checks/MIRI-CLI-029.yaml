# MIRI-CLI-029 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-CLI-029
name: changelog --since
target: cli
status: active
added_in: 0.1-draft
level: MUST
category: Update & Changelog
weight: 4
conditional: false
severity:
  default: HIGH
  violation_unit: the changelog surface
short_description: '`changelog --since <v> --json` is implemented'
long_description: '`changelog --since <v> --json` has to exist and exit 0 for every version in the published release history.
  Its stdout has to be a JSON document grouped per release between `<v>` and the current version. Rejecting a valid prior
  version, or ignoring the bound and dumping the full history, fails the check.'
rationale: '`check-update` says only *that* the tool moved; `changelog --since` says *what* moved. It is the recovery primitive
  for consumers whose knowledge froze at an older release. Frozen weights can never read release notes, and a skill file
  is only as fresh as its last regeneration (Landscape and Prior Art §3.1). Without it, an agent returning after three releases
  rediscovers surface changes by trial and error. It constructs from stale knowledge, hits an error, and retries with hallucinated
  variants. That is the silent degradation loop in which no bug report is ever filed.'
fires_when:
- no `changelog` subcommand exists, or `changelog --since <v> --json` exits non-zero for a version that exists in the published
  release history
- '`--since` rejects valid prior versions or ignores the bound and dumps the full history'
- output is not a JSON document on stdout grouped per release between `<v>` and the current version
remediation:
- Implement `changelog --since <version> --json` per §5.2, emitting one entry per release between `<version>` and `current`
- Derive it from the same schema-as-data struct that generates `--help` and `--describe` (§2.3) as a mechanical diff of
  the schema between releases, never as hand-written notes
- Validate accepted `--since` values against the same release manifest `check-update` consults; every published version
  is then accepted
examples:
  violation: |-
    $ acme-cli changelog --since 3.0.0 --json
    Error: unknown command "changelog" for "acme-cli"
    # the only changelog is prose on the forge — nothing a returning agent can query
  compliant: |-
    $ acme-cli changelog --since 3.0.0 --json
    {"schema_version": "1", "releases": [
      {"version": "3.1.0", "added": ["--output archive"],
       "deprecated": [{"surface": "--export", "removed_in": "3.2.0", "replacement": "--output archive"}]},
      {"version": "3.2.0", "removed": ["--export"]}]}
suggested_fix: Implement changelog --since <version> --json per CLI Spec §5.2.
references:
- title: CLI Spec §5.2
  url: cli-lifecycle-specification.md
  type: spec
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/cli/checks/MIRI-CLI-029.yaml
  html: https://miri-whl.github.io/checks/cli/MIRI-CLI-029.html
