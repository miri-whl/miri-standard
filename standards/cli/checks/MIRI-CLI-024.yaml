long_description: 'A CLI must be able to say who it is and what it offers, so scanners can join it against advisory databases
  and agents can trust the surface they see. This check verifies: Standalone binary carries embedded module info or references
  a release SBOM.'
examples:
  violation: A stripped Rust binary ships with no SBOM reference
  compliant: The release ships sbom.cdx.json referenced from identity.sbom
suggested_fix: Publish a CycloneDX/SPDX SBOM per release (or use cargo auditable / Go buildinfo).
