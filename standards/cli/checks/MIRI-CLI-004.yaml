# MIRI-CLI-004 — generated with the checklist table; committee-owned source of truth.
id: MIRI-CLI-004
name: Per-subcommand help
target: cli
status: active
added_in: 0.1-draft
level: SHOULD
category: Baseline Conventions
weight: 1
conditional: false
severity:
  default: MINOR
  violation_unit: each subcommand without help
  population_unit: all subcommands in --describe
short_description: '`<cli> <sub> --help` works for every subcommand'
long_description: 'Agents drive CLIs through the same conventions humans and scripts rely on; a tool that breaks them is
  invisible or hangs silently in a non-interactive context. This check verifies: `<cli> <sub> --help` works for every subcommand.'
rationale: Agents discover a command tree incrementally, one `--help` at a time (clig.dev's per-subcommand help recommendation
  exists for exactly this walk). A subcommand without help is a dead end that forces the agent to guess flags against the
  live tool — and for a mutating subcommand, guessing means learning the interface by side effect. Because help must derive
  from the same schema as the definition itself (CLI Spec §2.3), a missing subcommand help is also a symptom that the surface
  is hand-maintained and already drifting.
fires_when:
- For any subcommand listed in `--describe` or the root help, `<cli> <sub> --help` exits non-zero or reports an unknown
  flag
- '`<cli> <sub> --help` prints the root usage text instead of usage specific to `<sub>`'
- '`<cli> <sub> --help` exits 0 with empty or placeholder output'
remediation:
- Generate per-subcommand help from the same schema-as-data structure that defines the subcommand (CLI Spec §2.3); framework
  parsers (argparse subparsers, cobra, clap) do this when every subcommand is registered with its own description and flag
  set
- 'Add a CI loop: enumerate subcommands from `--describe` and assert `<cli> <sub> --help` exits 0 with non-empty, subcommand-specific
  stdout'
- For nested trees, verify the walk at every depth (`<cli> <sub> <subsub> --help`), not just the first level
examples:
  violation: '$ tool deploy --help

    error: unknown flag: --help

    $ tool config set --help

    Usage: tool [OPTIONS] COMMAND    # root help; nothing about ''config set'''
  compliant: "$ tool deploy --help\nUsage: tool deploy [OPTIONS] TARGET\n  --strategy <rolling|blue-green>\n  --dry-run\
    \   simulate without writing\n$ echo $?\n0"
suggested_fix: Wire --help on every subcommand.
references:
- title: clig.dev
  url: https://clig.dev/
  type: external
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/cli/checks/MIRI-CLI-004.yaml
  html: https://miri-whl.github.io/checks/cli/MIRI-CLI-004.html
