# MIRI-CLI-032 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-CLI-032
name: Two-phase fields
target: cli
status: active
added_in: 0.1-draft
level: MUST
category: Deprecation Coherence
weight: 2
conditional: true
severity:
  default: MINOR
  violation_unit: each incomplete lifecycle block
  population_unit: all surfaces carrying a lifecycle block
short_description: '`deprecated_since` and `removed_in`/`replacement` populated'
long_description: 'A `lifecycle` block with `status: "deprecated"` has to populate `deprecated_since` and at least
  one of `removed_in` and `replacement`. Each populated field also has to be usable: `removed_in` a valid version,
  `replacement` a non-empty string.'
rationale: The two-phase shape follows a citation trail instead of inventing one (§6.1). `deprecated_since` is the
  CLI analogue of RFC 9745's `Deprecation` header and marks that the phase has begun. `removed_in` is the analogue
  of RFC 8594's `Sunset` header and marks when the surface stops working. `replacement` follows PEP 702's `@deprecated`,
  GraphQL's `@deprecated(reason:)`, and Java's `@Deprecated(since, forRemoval)`. A block carrying only `deprecated_since`
  is half a contract. Consumers know to leave but learn neither when the door closes nor where to go. Migration
  can then be neither scheduled nor automated.
fires_when:
- 'a `lifecycle` block with `status: "deprecated"` lacks `deprecated_since`'
- neither `removed_in` nor `replacement` is populated on a deprecated surface
- populated fields are unusable — `removed_in` is not a valid version, or `replacement` is an empty string
remediation:
- Populate `deprecated_since` with the release that introduced the deprecation
- Populate `removed_in` honoring the §7.3 grace period (at least one minor release in which the surface still functions),
  and populate `replacement` with a successor surface present in the current `--describe` (§6.3-3)
- Add a `migration` URL when the replacement alone does not capture the behavioral change
- Validate lifecycle blocks against the introspection schema in release CI so incomplete blocks fail before shipping
examples:
  violation: "{\"name\": \"--export\",\n \"lifecycle\": {\"status\": \"deprecated\", \"deprecated_since\": \"1.14.0\"\
    }}\n# no removed_in, no replacement: consumers know to leave, not when or where to go"
  compliant: "{\"name\": \"--export\",\n \"lifecycle\": {\"status\": \"deprecated\", \"deprecated_since\": \"1.14.0\"\
    ,\n   \"removed_in\": \"1.18.0\", \"replacement\": \"--output archive\"}}"
suggested_fix: Populate the two-phase fields (RFC 9745/8594 shape).
references:
