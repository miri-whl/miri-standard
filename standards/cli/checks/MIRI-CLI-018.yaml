# MIRI-CLI-018 — generated with the checklist table; canonical source of truth.
id: MIRI-CLI-018
name: Wire schema versioned
target: cli
status: active
added_in: 0.1-draft
level: MUST
category: Identity & Introspection
weight: 1
conditional: false
severity:
  default: MEDIUM
  violation_unit: the introspection document
short_description: Top-level `schema_version` is independent of the release version
long_description: 'A CLI must be able to say who it is and what it offers, so scanners can join it against advisory databases
  and agents can trust the surface they see. This check verifies: the top-level `schema_version` is a genuine wire-contract
  version, not a restatement of the release version.'
rationale: 'The wire schema and the product move on different clocks: Docker''s agent CLI stamps "schema_version": "1" on
  every payload precisely so the product can reach 2.0 without the contract moving, and Terry Li''s envelope pattern versions
  the envelope because the envelope shape is the API (landscape §2.3, §3.3-1). A schema_version that merely mirrors the
  release version destroys the signal in both directions: a consumer pinning it must either treat every routine release
  as a contract break or learn nothing when the payload genuinely breaks mid-series. Per CLI Spec §3.1, schema_version is
  a top-level field, not nested in identity; MIRI-CLI-010 verifies its presence, this check verifies its independence.'
fires_when:
- The top-level `schema_version` in `--describe` is identical to `identity.version` and moves in lockstep with releases
- No documented policy states which changes bump the top-level `schema_version`
remediation:
- Declare a small independent contract version (e.g. "1") as the top-level `schema_version`, separate from the release
  version in `identity.version`, and stamp the same value on every JSON payload (MIRI-CLI-010)
- 'Document the bump policy: it increments only on breaking payload changes — removed or renamed fields, changed types or
  semantics — never on releases that leave the shape intact'
- Record each bump as a wire-schema change in `changelog --since` output (§5.2), and consider serving prior shapes via --schema-version
  pinning (landscape §3.3-6)
examples:
  violation: '{"schema_version": "3.4.1", "identity": {"version": "3.4.1"}}

    # the contract version is the release number restated; pins are meaningless'
  compliant: '{"schema_version": "1", "identity": {"version": "3.4.1"}}

    # payload contract unchanged across the 3.x series; a breaking change would make it "2"'
suggested_fix: Version the wire schema separately from the release version and declare it top-level.
references:
- title: CLI Spec §3.1
  url: cli-lifecycle-specification.md
  type: spec
