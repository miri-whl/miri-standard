# MIRI-CLI-018 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-CLI-018
name: Wire schema versioned
target: cli
status: active
added_in: 0.1-draft
level: MUST
category: Identity & Introspection
weight: 1
conditional: false
severity:
  default: MEDIUM
  violation_unit: the introspection document
short_description: Top-level `schema_version` is independent of the release version
long_description: The top-level `schema_version` in `--describe` has to be a wire-contract version of its own. A value identical
  to `identity.version` that moves in lockstep with releases fails the check. A missing policy stating which changes bump
  `schema_version` also fails it.
rationale: 'The wire schema and the product move on different clocks. Docker''s agent CLI stamps "schema_version": "1" on
  every payload so the product can reach 2.0 without the contract moving. Terry Li''s envelope pattern versions the envelope
  because the envelope shape is the API (Landscape and Prior Art §2.3, §3.3-1). A schema_version that mirrors the release
  version destroys the signal in both directions. A consumer pinning it must either treat every routine release as a contract
  break or learn nothing when the payload breaks mid-series. Per CLI Spec §3.1, schema_version is a top-level field and
  is not nested in identity. MIRI-CLI-010 verifies its presence; this check verifies its independence.'
fires_when:
- The top-level `schema_version` in `--describe` is identical to `identity.version` and moves in lockstep with releases
- No documented policy states which changes bump the top-level `schema_version`
remediation:
- Declare a small independent contract version (e.g. "1") as the top-level `schema_version`, separate from the release version
  in `identity.version`, and stamp the same value on every JSON payload (MIRI-CLI-010)
- 'Document the bump policy: it increments only on breaking payload changes (removed or renamed fields, changed types or
  semantics) and never on releases that leave the shape intact'
- Record each bump as a wire-schema change in `changelog --since` output (§5.2), and consider serving prior shapes via --schema-version
  pinning (Landscape and Prior Art §3.3-6)
examples:
  violation: '{"schema_version": "3.4.1", "identity": {"version": "3.4.1"}}

    # the contract version is the release number restated; pins are meaningless'
  compliant: '{"schema_version": "1", "identity": {"version": "3.4.1"}}

    # payload contract unchanged across the 3.x series; a breaking change would make it "2"'
suggested_fix: Version the wire schema separately from the release version and declare it top-level.
references:
- title: CLI Spec §3.1
  url: cli-lifecycle-specification.md
  type: spec
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/cli/checks/MIRI-CLI-018.yaml
  html: https://miri-whl.github.io/checks/cli/MIRI-CLI-018.html
