# MIRI-CLI-040 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-CLI-040
name: Danger marked
target: cli
status: active
added_in: 0.1-draft
level: MUST
category: Safety
weight: 3
conditional: false
severity:
  default: HIGH
  violation_unit: each unmarked destructive operation
  population_unit: all mutating commands in --describe
short_description: Destructive operations flagged as such in `--describe`
long_description: 'A command that irrecoverably deletes or overwrites data has to carry a structured destructive marking
  (e.g. `destructive: true`) in its `--describe` entry. Prose in the help text alone does not count. Commands that destroy
  data in fixtures, or whose names signal it (`purge`, `destroy`, `reset`, `rm`), fail when they are unmarked while other
  commands in the same binary are marked.'
rationale: 'An agent cannot weigh a risk it cannot see. A `purge` whose `--describe` entry is indistinguishable from a `tag`
  gets retried and parallelized with ordinary-write caution. Agent-First CLI principle 16 (signal danger: guardrails over
  good luck) exists so that a policy layer is possible at all. The `--capabilities` output of desk serves the same purpose.
  It lists the destructive commands of each service. A harness can require human confirmation or a dry run before destructive
  calls only if destructiveness is machine-readable instead of implied by prose or a verb name.'
fires_when:
- 'A command that irrecoverably deletes or overwrites data carries no structured destructive marking (e.g. `destructive:
  true`) in its `--describe` entry'
- Destructiveness is stated only in human help prose, with no field a harness can branch on
- Commands whose observed behavior destroys data (fixture-based evidence) or whose names conventionally signal it (`purge`,
  `destroy`, `reset`, `rm`) are unmarked while other commands in the same binary are marked
remediation:
- 'Add `destructive: true` to the command''s schema-as-data definition so `--describe` and `--help` both derive it (§2.3)'
- Require an explicit `--force` (or `--yes`) for marked commands when stdin is not a TTY, exiting with a structured `CONFIRMATION_REQUIRED`
  error otherwise
- Audit the full surface for destruction paths (delete, purge, destroy, reset, and any overwrite of user data), mark each
  one, and pair the marking with `--dry-run` support (MIRI-CLI-039)
examples:
  violation: '--describe:

    {"name": "purge", "description": "Remove all cached artifacts", "mutating": true}

    Nothing distinguishes purge from an ordinary write; an agent''s guardrail layer has no field to branch on and invokes
    it like any other command.'
  compliant: "--describe:\n{\"name\": \"purge\", \"description\": \"Remove all cached artifacts\", \"mutating\": true, \"destructive\": true}\n\
    $ tool purge\n{\"schema_version\": \"1\", \"ok\": false, \"error\": {\"code\": \"CONFIRMATION_REQUIRED\", \"retryable\": false,\n  \"suggestions\"\
    : [\"re-run with --force, or preview with --dry-run\"]}}"
suggested_fix: Mark destructive operations in the introspection output.
references:
