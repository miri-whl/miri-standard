# MIRI-CLI-009 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-CLI-009
name: One output flag
target: cli
status: active
added_in: 0.1-draft
level: MUST
category: Machine Output
weight: 2
conditional: false
severity:
  default: MEDIUM
  violation_unit: each inconsistent command
  population_unit: all commands in --describe
short_description: The same flag (e.g. `--json`) selects it on every command and has no per-command variants
long_description: The flag that selects machine output has to be the same on every command and match the root flag recorded
  in `--describe`. Different spellings across commands (`--json` on some, `--output json` or `--format=json` on others),
  or subcommands that reject the root-level flag, are violations.
rationale: 'The ecosystem''s own fragmentation shows the cost. Three tools use three grammars for one concept: `-o json`
  in kubectl, `--format json` in docker, and `--json <fields>` in gh. Nothing an agent learns on one tool transfers to the
  next. Inside a single CLI the same inconsistency does more damage (Chow, Landscape and Prior Art §2.3). An agent that
  learned `--json` on one command constructs it on the next and gets `unknown flag`. From then on it treats the whole tool
  as unreliable and re-verifies every invocation it should have been able to generalize.'
fires_when:
- Different commands select machine output with different flags (`--json` on some, `--output json` or `--format=json` on
  others)
- The root-level output flag exists but is rejected by some subcommands
- '`--describe` records per-command output-flag names that differ from the root flag'
remediation:
- 'Define the output flag once at the root parser and inherit it everywhere: cobra `PersistentFlags()`, clap `global = true`,
  argparse via a shared parent parser'
- Migrate stragglers by aliasing the legacy per-command spelling to the root flag, marking the alias with a `lifecycle`
  block (`deprecated_since`, `replacement`) per CLI Spec §6 until removal
- 'Assert uniformity in CI: every command in `--describe` accepts the root output flag and lists no variant spellings'
examples:
  violation: '$ tool list --json

    {"items": []}

    $ tool status --json

    error: unknown flag: --json (did you mean --output json?)

    # same tool, two grammars for the same concept'
  compliant: '$ tool list --json | jq -e .schema_version

    "1"

    $ tool status --json | jq -e .schema_version

    "1"            # one flag, inherited by every command from the root parser'
suggested_fix: Pick one output flag and use it everywhere.
references:
- title: Landscape §2.3 (Chow)
  url: landscape-and-prior-art.md
  type: spec
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/cli/checks/MIRI-CLI-009.yaml
  html: https://miri-whl.github.io/checks/cli/MIRI-CLI-009.html
