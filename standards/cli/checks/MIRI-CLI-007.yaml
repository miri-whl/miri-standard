# MIRI-CLI-007 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-CLI-007
name: Pipeline composability
target: cli
status: active
added_in: 0.1-draft
level: SHOULD
category: Baseline Conventions
weight: 1
conditional: false
severity:
  default: MINOR
  violation_unit: each composability failure
short_description: Handles SIGPIPE cleanly; accepts stdin where input is expected
long_description: The tool passes when `<cli> list | head -1` leaves stderr free of tracebacks, panics, and crash
  reports and the closed pipe ends the process cleanly (a plain SIGPIPE death, shell status 141, is acceptable). A
  command that consumes input passes when it accepts that input on stdin, either bare or through the `-` operand.
rationale: 'Pipelines are how a CLI''s output becomes the next tool''s input. Python''s own signal docs document the classic
  failure. Piping to `head(1)` sends SIGPIPE when the reader closes early. Unhandled, Python surfaces it as a `BrokenPipeError:
  [Errno 32] Broken pipe` traceback. Rust ignores SIGPIPE at startup, and the same event becomes a panic on write. The consumer
  already got its data. Stderr still fills with a crash report, and the exit status reads as failure. Scripts running under
  `set -e` abort, and agents burn turns diagnosing a phantom error. Refusing stdin has the mirror cost: output must detour
  through temp files instead of composing.'
fires_when:
- '`<cli> list | head -1` leaves a traceback, panic message, or crash report on stderr'
- The tool's exit after a closed pipe reflects an internal crash rather than clean termination (a plain SIGPIPE death, shell
  status 141, is acceptable)
- A command that conceptually consumes input can read only from file arguments — neither bare stdin nor the `-` convention
  works
remediation:
- 'Handle EPIPE as clean shutdown: in Python, catch `BrokenPipeError`, redirect stdout to `os.devnull`, and exit quietly
  per the documented pattern; in Rust, restore default SIGPIPE disposition or map `ErrorKind::BrokenPipe` to a silent exit'
- Accept stdin wherever input is expected, honoring `-` as the conventional stdin operand
- 'Add CI assertions: `<cli> list | head -1` produces empty stderr, and `echo <input> | <cli> <consume-cmd>` succeeds'
examples:
  violation: "$ tool list | head -1\nitem-001\nTraceback (most recent call last):\n  File \"tool\", line 88, in main\nBrokenPipeError:\
    \ [Errno 32] Broken pipe\n# set -e pipeline aborts although head got its line"
  compliant: '$ tool list | head -1

    item-001

    $ tool list | head -1 2>err.txt; wc -c < err.txt

    0            # early reader exit produces no crash output

    $ cat ids.txt | tool resolve -    # ''-'' reads stdin

    '
suggested_fix: Handle SIGPIPE; read stdin where input is expected.
references:
- title: clig.dev
  url: https://clig.dev/
  type: external
