# MIRI-CLI-038 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-CLI-038
name: Replacements resolve
target: cli
status: active
added_in: 0.1-draft
level: MUST
category: Deprecation Coherence
weight: 2
conditional: true
severity:
  default: MEDIUM
  violation_unit: each unresolvable replacement
  population_unit: all lifecycle blocks naming a replacement
short_description: Every `replacement` names a surface in the current `--describe`
long_description: Every `lifecycle.replacement` value has to resolve to a flag or subcommand path in the same binary's
  current `--describe`, and that surface must be neither deprecated nor removed itself. The `suggestions` of the
  structured removal error have to name surfaces present in `--describe` as well.
rationale: The `replacement` field is read at the moment a consumer's old invocation stopped working. CLI Spec §6.3-3
  therefore requires it to name a surface present in the current `--describe`. A pointer at a flag that was renamed
  before shipping, mistyped, or never built sends the migrating consumer into a second failure. That failure is
  worse than the first because the consumer followed the tool's own instruction to get there. In a conforming implementation
  the property holds by construction (§2.3, one schema struct). The check catches hand-maintained replacement strings
  that nothing ever resolved.
fires_when:
- A `lifecycle.replacement` value names a flag or subcommand path that does not resolve against the same binary's
  current `--describe` output
- A replacement names a surface whose own `lifecycle.status` is `deprecated` or which has itself been removed —
  the pointer leads into another dead end
- The structured removal error's `suggestions` name a surface absent from `--describe` (the teaching error and the
  lifecycle block must draw from the same resolved data)
remediation:
- 'Resolve every `replacement` value against the release build''s own `--describe` in CI: parse the introspection
  output, and assert each replacement matches an existing subcommand path or flag (including any argument value
  against that flag''s enum)'
- Reference replacement surfaces by their schema-as-data identifier rather than free-form strings, so a rename propagates
  automatically (§2.3)
- Where a deprecated surface's successor lives in another tool, use the `support` block's purl-based `replacement`
  (§3.2) instead of a dangling in-tool pointer
examples:
  violation: '--describe entry:

    {"name": "--export", "lifecycle": {"status": "deprecated", "replacement": "--output archive"}}

    but --describe lists no --output flag — it shipped as --format after a late rename.

    The migrating agent runs `tool get --format? --output archive` and fails again, this time on the tool''s own
    advice.'
  compliant: '--describe lists:

    {"name": "--output", "type": "enum", "values": ["json", "archive", "table"]}

    and the deprecated entry points at it:

    {"name": "--export", "lifecycle": {"status": "deprecated", "replacement": "--output archive"}}

    CI resolves "--output archive" against the same describe document and passes.'
suggested_fix: Point replacement at a surface present in the current --describe.
references:
- title: CLI Spec §6.3-3
  url: cli-lifecycle-specification.md
  type: spec
urls:
