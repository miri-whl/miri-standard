# MIRI-CLI-021 — generated with the checklist table; committee-owned source of truth.
id: MIRI-CLI-021
name: EOL coherence
target: cli
status: active
added_in: 0.1-draft
level: MUST
category: Identity & Introspection
weight: 2
conditional: false
severity:
  default: HIGH
  violation_unit: the support declaration
short_description: '`support.status` `deprecated`/`eol` ⇒ `replacement` present'
long_description: 'A CLI must be able to say who it is and what it offers, so scanners can join it against advisory databases
  and agents can trust the surface they see. This check verifies: `support.status` `deprecated`/`eol` ⇒ `replacement` present.'
rationale: 'Spec §3.2 requires `replacement` whenever status is deprecated or eol, because a deprecation without a successor
  tells consumers only to leave, with no destination — the workflow the tool served still exists, and every consumer must
  rediscover where it went. The rule follows the converged deprecation vocabulary in which the marker always carries the
  forward path (PEP 702''s @deprecated message, Rust''s #[deprecated(note)], RFC 9745''s deprecation link relation), delivered
  here through --describe — the one channel that reaches frozen-weights consumers at call time. lifecycle-v1.json encodes
  the same constraint as a conditional requirement.'
fires_when:
- '`support.status` is "deprecated" or "eol" while `support.replacement` is null or absent'
- '`replacement` is present but is neither a well-formed purl nor a subcommand path in an absorbing CLI'
remediation:
- 'Name the successor tool as a purl: "replacement": "pkg:generic/acme/acme-cli2"'
- When the successor is absorption into another CLI, name the subcommand path instead (e.g. "acme2 legacy deploy")
- Set `eol_date` alongside, and publish a migration guide so the per-flag lifecycle blocks (§6) can point individual surface
  moves at it
examples:
  violation: '"support": {"status": "eol", "replacement": null}

    # every caller is told the tool is dead and nothing else'
  compliant: "\"support\": {\"status\": \"deprecated\", \"eol_date\": \"2027-01-31\",\n  \"replacement\": \"pkg:generic/acme/acme-cli2\"\
    }"
suggested_fix: Name the successor (purl or absorbing subcommand).
references:
- title: CLI Spec §3.2
  url: cli-lifecycle-specification.md
  type: spec
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/cli/checks/MIRI-CLI-021.yaml
  html: https://miri-whl.github.io/checks/cli/MIRI-CLI-021.html
