# MIRI-CLI-003 — generated with the checklist table; committee-owned source of truth.
id: MIRI-CLI-003
name: --version
target: cli
status: active
added_in: 0.1-draft
level: MUST
category: Baseline Conventions
weight: 1
conditional: false
severity:
  default: MINOR
  violation_unit: the --version behavior
short_description: Prints version to stdout, exits 0
long_description: 'Agents drive CLIs through the same conventions humans and scripts rely on; a tool that breaks them is
  invisible or hangs silently in a non-interactive context. This check verifies: Prints version to stdout, exits 0.'
rationale: 'GNU Coding Standards §4.7 gives `--version` the same contract as `--help`: version to stdout, successful exit.
  In this standard the string carries extra load: it is the value that MIRI-CLI-017 must match against `identity.version`
  in `--describe`, and via the purl it is the join key for advisory lookups and `check-update` comparisons (CLI Spec §9-1).
  A version printed to stderr, wrapped in prose, or gated behind a network call breaks the cheapest identity probe a scanner
  or agent has.'
fires_when:
- '`--version` writes its output to stderr, or exits non-zero'
- stdout contains no parseable version token, or buries it in multi-line prose or update advertisements
- '`--version` performs a network call or blocks before printing'
remediation:
- Print a single line to stdout — the bare version or `<name> <version>` — and exit 0
- Derive the string from the same source of truth as `identity.version` in `--describe`, so the two cannot drift (CLI Spec
  §2.3)
- Keep the version path offline and side-effect free; update information belongs to `check-update --json`, not `--version`
examples:
  violation: "$ tool --version\n(stderr) tool v3.2.0 — a newer release may be available, see https://acme.example\n$ v=$(tool\
    \ --version); echo \"$v\"\n            # empty: the version never reached stdout\n$ echo $?\n1"
  compliant: '$ tool --version

    3.2.0

    $ echo $?

    0            # matches identity.version in `tool --describe`'
suggested_fix: Print the version to stdout and exit 0.
references:
- title: GNU Coding Standards §4.7
  url: https://www.gnu.org/prep/standards/html_node/_002d_002dversion.html
  type: external
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/cli/checks/MIRI-CLI-003.yaml
  html: https://miri-whl.github.io/checks/cli/MIRI-CLI-003.html
