# MIRI-CLI-016 — generated with the checklist table; canonical source of truth.
id: MIRI-CLI-016
name: Identity purl
target: cli
status: active
added_in: 0.1-draft
level: MUST
category: Identity & Introspection
weight: 3
conditional: false
severity:
  default: CRITICAL
  violation_unit: the identity declaration
short_description: '`identity.purl` present, well-formed, matches distribution channel'
long_description: 'A CLI must be able to say who it is and what it offers, so scanners can join it against advisory databases
  and agents can trust the surface they see. This check verifies: `identity.purl` present, well-formed, matches distribution
  channel.'
rationale: 'Every scanner runs the same loop — build inventory, normalize to purl, compare against OSV affected ranges —
  so the purl is the single join key that makes vulnerability and currency verdicts computable; a CLI without one falls
  back to CPE matching, where vendor/product strings must be guessed from binary names and internal tools are simply invisible.
  The type must match the distribution channel because advisory records attach to registry-native names: a Homebrew-distributed
  tool declaring pkg:generic never joins against records filed under its brew coordinates. Spec §3.1 therefore requires
  the channel''s own purl type (pkg:npm, pkg:pypi, pkg:cargo, pkg:brew, …), reserving pkg:generic with a repository_url
  qualifier for direct binary distribution.'
fires_when:
- '`identity.purl` is absent from the --describe output'
- The value fails purl grammar — no `pkg:` scheme, missing type or name, or no `@version` segment
- The purl type contradicts the actual install channel (an npm-distributed tool declaring pkg:generic; a Homebrew formula
  declaring pkg:npm)
- The type is pkg:generic without a `repository_url` qualifier locating the release source
remediation:
- 'Choose the purl type of the real distribution channel: pkg:npm/, pkg:pypi/, pkg:cargo/, pkg:golang/, pkg:brew/; use pkg:generic/<org>/<name>@<version>?repository_url=<releases
  URL> only for direct binary distribution'
- Embed the purl at build time from the release version (e.g. go build -ldflags "-X main.purl=pkg:brew/acme-cli@$VERSION")
  so it cannot drift from the artifact
- Validate the value in CI with a purl library (packageurl-python, packageurl-go) before publishing
examples:
  violation: '"identity": {"version": "3.2.0", "distribution": "open-source"}

    # no purl: scanners are back to guessing a CPE from the binary''s file name'
  compliant: '"identity": {"purl": "pkg:brew/acme-cli@3.2.0", "version": "3.2.0"}

    # matches the Homebrew channel; joins directly against OSV records for that name'
suggested_fix: Declare identity.purl using the distribution channel's purl type.
references:
- title: CLI Spec §3.1
  url: cli-lifecycle-specification.md
  type: spec
- title: purl spec
  url: https://github.com/package-url/purl-spec
  type: external
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/cli/checks/MIRI-CLI-016.yaml
  html: https://miri-whl.github.io/checks/cli/MIRI-CLI-016.html
