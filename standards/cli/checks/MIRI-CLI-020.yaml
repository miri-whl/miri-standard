# MIRI-CLI-020 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-CLI-020
name: Support block
target: cli
status: active
added_in: 0.1-draft
level: MUST
category: Identity & Introspection
weight: 2
conditional: false
severity:
  default: MEDIUM
  violation_unit: the support declaration
short_description: '`support` present with valid `status`'
long_description: '`--describe` has to carry a top-level `support` block whose `status` is one of active, maintenance, deprecated,
  or eol. The block also has to validate against the shared support shape in lifecycle-v1.json. A status written as free
  text instead of the enum fails that validation.'
rationale: The support block is the one lifecycle statement the artifact carries directly. It records vendor-authored intent
  instead of a computed verdict. `--describe` is the only channel that reaches consumers at call time, including agents
  whose frozen weights will never see the release note announcing maintenance mode (Landscape and Prior Art §3.1). The status
  vocabulary (active / maintenance / deprecated / eol) is shared with the Python specification's support object and validated
  by lifecycle-v1.json. It is also deliberately mappable onto the OASIS OpenEoX stages. One reader therefore covers every
  Miri artifact type.
fires_when:
- --describe carries no top-level `support` block
- '`support.status` is missing or outside the enum active / maintenance / deprecated / eol'
- The block fails validation against the shared support shape of lifecycle-v1.json (e.g. status expressed as free text instead
  of the enum)
remediation:
- 'Add a `support` block per CLI Spec §3.2: `status`, plus `supported_versions`, `eol_date`, `replacement`, and `security_policy`'
- Source it from the same schema-as-data structure as the rest of --describe (§2.3); a status change is then one field edit
  that propagates to every output
- Validate in CI against the shared shape, e.g. jsonschema.validate(describe["support"], lifecycle_schema["properties"]["support"])
examples:
  violation: '$ acme --describe | jq .support

    null   # the tool entered maintenance at 3.0; only the release notes say so'
  compliant: "\"support\": {\"status\": \"maintenance\", \"supported_versions\": [\">=3.0,<4.0\"],\n  \"eol_date\": \"2027-06-30\"\
    , \"replacement\": null,\n  \"security_policy\": \"https://github.com/acme/acme-cli/blob/main/SECURITY.md\"}"
suggested_fix: Add support with a valid status per CLI Spec §3.2.
references:
- title: CLI Spec §3.2
  url: cli-lifecycle-specification.md
  type: spec
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/cli/checks/MIRI-CLI-020.yaml
  html: https://miri-whl.github.io/checks/cli/MIRI-CLI-020.html
