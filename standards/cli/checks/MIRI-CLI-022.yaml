# MIRI-CLI-022 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-CLI-022
name: Advisory sources
target: cli
status: active
added_in: 0.1-draft
level: MUST
category: Identity & Introspection
weight: 3
conditional: false
severity:
  default: HIGH
  violation_unit: the advisory_sources list
short_description: ≥1 valid entry in `advisory_sources`
long_description: '`advisory_sources` in `--describe` has to hold at least one entry, and every entry needs a type
  of osv, osv-internal, or osv-local and a `url`. An "osv" entry also needs an `ecosystem`. At least one entry has
  to be authoritative for the artifact unless `advisory_coverage` is `none`, and an authoritative entry that names
  an ecosystem has to name one the artifact is distributed in. A `none` coverage requires `support.security_policy`
  instead.'
rationale: Under Miri's first design principle (§2.1), the CLI declares where advisories live and consumers compute
  the verdict at call time. `advisory_sources` is the pointer that every vulnerability answer about the tool passes
  through. An empty or missing list opts the tool out of that join while the rest of `--describe` still looks
  compliant. The omission is silent because OSV-style endpoints return an empty result for names they have never
  seen. That result is indistinguishable from an audited clean bill. CLI Spec §4 requires at least one entry of
  a valid type (osv, osv-internal, osv-local).
fires_when:
- --describe carries no `advisory_sources`, or the array is empty
- An entry's `type` is outside osv / osv-internal / osv-local, or its `url` is missing
- An entry of type "osv" omits the `ecosystem` field needed to scope the OSV.dev query
- 'No entry is authoritative for the artifact itself: every entry carries `authoritative: false`, which per CLI
  Spec 4 covers only the dependency tree, and `advisory_coverage` is not `none`. Without this clause the check is
  satisfied by an array that declares in its own fields that nothing covers the artifact, so a consumer asking
  whether the tool is vulnerable finds every field valid and no source to query'
- '`advisory_coverage` is `none` but `support.security_policy` is absent, leaving neither a machine channel nor a
  human one'
- 'An entry marked authoritative for the artifact names an ecosystem the artifact is not distributed in: an OSV
  query keyed on the declared `identity.purl` cannot match records in that ecosystem, so the source is unreachable
  in practice while well-formed on paper. This clause is scoped to authoritative entries deliberately: a
  non-authoritative entry covers the dependency tree, where naming the ecosystem the dependencies come from is
  correct even when the artifact itself is distributed elsewhere'
remediation:
- 'Where no OSV ecosystem indexes the artifact, declare `advisory_coverage: none` and publish
  `support.security_policy` rather than naming an ecosystem the artifact is not distributed in'
- 'Declare the source matching the distribution channel; for open source, public OSV with the shipping ecosystem: {"type":
  "osv", "ecosystem": "npm", "url": "https://api.osv.dev/v1/query", "authoritative": true}'
- 'For private CLIs, point at the internal OSV-schema endpoint or offline archive: {"type": "osv-internal", "url": "https://advisories.corp.acme.example/v1/query"},
  or an osv-local database path for air-gapped installs (§8.2–8.3)'
- 'Set `authoritative: true` on the source that carries advisories against the tool itself, as opposed to sources covering
  only its dependency tree'
examples:
  violation: '$ acme --describe | jq .advisory_sources

    []   # no join possible; every scanner reports the tool clean by omission'
  compliant: "\"advisory_sources\": [\n  {\"type\": \"osv\", \"ecosystem\": \"npm\", \"url\": \"https://api.osv.dev/v1/query\"\
    , \"authoritative\": true}\n]"
suggested_fix: Declare at least one OSV-compatible advisory endpoint.
references:
- title: CLI Spec §4
  url: cli-lifecycle-specification.md
  type: spec
- title: OSV schema
  url: https://ossf.github.io/osv-schema/
  type: external
urls:
