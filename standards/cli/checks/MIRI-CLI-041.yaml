# MIRI-CLI-041 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-CLI-041
name: Read/write visible
target: cli
status: active
added_in: 0.1-draft
level: MUST
category: Safety
weight: 2
conditional: false
severity:
  default: MEDIUM
  violation_unit: each ambiguous command
  population_unit: all commands in --describe
short_description: The read-vs-write nature of each command is determinable from `--describe`/`--help` alone
long_description: Each command's `--describe` entry has to carry a machine-readable read/write field (`mutating`, `mode`,
  or a declared equivalent), and the command name or `--help` has to make the direction clear. A command declared read-only
  that writes when run against a fixture fails the check.
rationale: As a MUST, anc.dev requires the read-vs-write distinction to be visible from the command name and `--help` alone.
  The read/write partition is the cheapest safety property a CLI can offer. Reads can be freely retried, parallelized,
  and run speculatively. Writes need the full apparatus of dry runs, idempotency, and confirmation. When a verb like `sync`
  or `update` leaves the direction ambiguous, a careful agent has to treat every command as a write and forfeits parallelism.
  A careless one guesses, and guessing is how unintended mutations happen.
fires_when:
- A command's `--describe` entry carries no machine-readable read/write field (`mutating`, `mode`, or equivalent declared
  in the introspection schema)
- Neither the command name nor its `--help` text determines whether invocation changes state (e.g. `sync` with no stated
  direction)
- 'A field is present but false to behavior: a command declared read-only observably writes when run against a fixture'
remediation:
- 'Declare `mutating: true|false` per command in the schema-as-data definition so `--describe` and `--help` derive it together
  (§2.3)'
- For ambiguous verbs, state the direction in the first help sentence ("Upload local changes to the remote") or split the
  command (`push`/`pull`) rather than documenting around the ambiguity
- 'Verify the declaration in CI: run every command marked read-only against a fixture and assert a state fingerprint taken
  before and after is identical'
examples:
  violation: '$ tool sync --help

    Synchronize the workspace.

    $ tool --describe | jq ''.commands[] | select(.name=="sync")''

    {"name": "sync", "description": "Synchronize the workspace."}

    Whether sync uploads, downloads, or both is undeterminable; the agent must assume it writes.'
  compliant: "$ tool --describe | jq '.commands[] | select(.name==\"sync\")'\n{\"name\": \"sync\", \"mutating\": true,\n\
    \ \"description\": \"Upload local changes to the remote workspace.\"}\nReads elsewhere in the same describe carry \"mutating\"\
    : false and can be parallelized freely."
suggested_fix: Make the read-vs-write nature explicit per command.
references:
- title: CLI Spec §6.4
  url: cli-lifecycle-specification.md
  type: spec
- title: Landscape §2.2 (anc.dev)
  url: landscape-and-prior-art.md
  type: spec
