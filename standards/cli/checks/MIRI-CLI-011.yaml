# MIRI-CLI-011 — generated with the checklist table; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-CLI-011
name: Clean payload channel
target: cli
status: active
added_in: 0.1-draft
level: MUST
category: Machine Output
weight: 2
conditional: false
severity:
  default: HIGH
  violation_unit: each polluted payload
  population_unit: all commands emitting JSON
short_description: No ANSI codes, prose, or warnings mixed into stdout JSON
long_description: In JSON mode, stdout has to pass a strict JSON parse (`jq -e .`) and contain no ESC bytes. Update banners,
  deprecation notices, or progress text before, after, or inside the JSON document are violations.
rationale: 'CLI Spec §2.5 reserves stdout for the JSON payload and sends all warnings to stderr because the channels fail
  differently. A warning on stderr is ignorable. One stray notice printed into stdout makes the document unparseable: `jq`
  aborts with `Invalid literal`, and every downstream consumer fails at once. The failure starts on the day the notice
  ships. No schema change is involved. This is the highest-blast-radius mistake available to a machine-output CLI. The
  trigger is routine (a deprecation notice, an update banner, a stray `print` in a logging path), and the failure is total.'
fires_when:
- stdout of any JSON-mode invocation fails a strict JSON parse (`jq -e .` non-zero)
- Prose lines — update banners, deprecation notices, progress text — precede, follow, or interleave the JSON document on
  stdout
- ESC bytes (0x1b) appear inside stdout in JSON mode
remediation:
- Route every diagnostic through a channel that writes to stderr; audit the logging configuration as well, because many
  logging frameworks default their handlers to stdout
- In JSON mode, write stdout exactly once, from the shared response envelope (one serialized document, then exit)
- Keep decoration out of JSON mode regardless of TTY state (see MIRI-CLI-005)
- 'Parse your own stdout in CI: for every command, `<cmd> --json | jq -e . >/dev/null` and assert the byte stream contains
  no 0x1b'
examples:
  violation: '$ tool list --json

    WARNING: --legacy-ids is deprecated, use --ids

    {"schema_version": "1", "items": []}

    $ tool list --json | jq .

    jq: error (at <stdin>:1): Invalid literal at line 1, column 8

    # every consumer broke the day the warning shipped'
  compliant: '$ tool list --json 2>warnings.txt

    {"schema_version": "1", "items": []}

    $ cat warnings.txt

    WARNING: --legacy-ids is deprecated, use --ids

    # payload parses; the notice survives on its own channel'
suggested_fix: Keep stdout pure JSON; warnings go to stderr.
references:
- title: CLI Spec §2.5
  url: cli-lifecycle-specification.md
  type: spec
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/cli/checks/MIRI-CLI-011.yaml
  html: https://miri-whl.github.io/checks/cli/MIRI-CLI-011.html
