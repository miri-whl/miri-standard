$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-CONSUMER-001
name: Reports an absent document as absent
target: consumer
status: active
added_in: 0.3-draft
level: MUST
category: Honest Degradation
weight: 7
conditional: false
severity:
  default: HIGH
  violation_unit: each absent document reported as anything other than absent
short_description: Reports an absent document as absent
long_description: Driven against the `bare` fixture, the consumer has to state in its output that the requested
  document is absent. The check fails output that omits the fact, fills the gap, or reports the absence as an error
  (or an error as an absence).
rationale: The bare/miri comparison depends on this check. If a consumer answers the same way whether or not the
  metadata exists, the metadata did not produce the answer. The Discovery Contract ranks the absent-versus-failed
  split as its most consequential clause. A consumer's handling of absence can be checked only if the surface reports
  absence distinctly from failure. No existing tool checks this because no existing tool defines a consumer.
fires_when:
- The consumer is driven against the `bare` fixture and its output does not state that the requested document
  is absent
- The consumer reports an absent document as an error, or an error as an absence
- The consumer silently omits any mention of a document it was asked about and did not receive
remediation:
- Branch on the envelope's `present` field and, when it is false, write an explicit 'no such document' statement
  into the consumer's output
- Use separate output wording for absence and for failure, matching the `ok`/`present` split
suggested_fix: Report an absent document as absent
references:
- title: Discovery Contract §4.2
  url: discovery-contract.md
  type: spec
- title: Consumption Map §4
  url: consumption-map.md
  type: spec
examples:
  violation: 'greet_bare — lifecycle: active, supported.

    (no lifecycle.json was served; status was assumed)'
  compliant: 'greet_bare — lifecycle: NOT DECLARED.

    The package ships no lifecycle.json, so support status and advisory sources are unknown.'
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/consumption/checks/MIRI-CONSUMER-001.yaml
  html: https://miri-whl.github.io/checks/consumer/MIRI-CONSUMER-001.html
