# MIRI-SURFACE-020 — generated with the Surface Conformance profile; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-SURFACE-020
name: Serves only the closed servable set; refuses anything else
target: surface
status: active
added_in: 0.3-draft
level: MUST
category: Boundaries
weight: 8
conditional: false
severity:
  default: CRITICAL
  violation_unit: each document served from outside the servable set
short_description: Serves only the closed servable set; refuses anything else
long_description: Discovery Contract §3.2.1 defines a closed servable set for `document`. A request for
  a name outside that set has to be refused with `DOCUMENT_NOT_SERVABLE`, and a name absent from the package's
  `list.documents` is never served. A servable name that the package does not ship gets the absent response
  of §4.2, never `DOCUMENT_NOT_SERVABLE`. The check fires when the surface serves a file outside the set
  (`prompt-templates.md`, `README.md`) or answers with a filesystem error.
examples:
  violation: document(name="prompt-templates.md") -> the file contents
  compliant: "{\"schema_version\": \"1\", \"ok\": false, \"package\": \"greet_miri\",\n \"error\": {\"code\": \"\
    DOCUMENT_NOT_SERVABLE\", \"retryable\": false}}"
rationale: The servable set is closed on a stated principle. Only schema-governed documents are servable, and no
  free-form natural-language document ever is. Prose is the highest-risk payload a publisher controls. A document
  with no schema has no property a consumer can verify before it reaches a model's context. A surface that extends
  the set reopens the injection channel that refusing prompt-templates.md was meant to close.
fires_when:
- A request for `prompt-templates.md`, `README.md`, or any document outside §3.2.1's set returns the file
- A name absent from the package's `list.documents` is served
- The surface returns a filesystem error rather than `DOCUMENT_NOT_SERVABLE`
remediation:
- Check the requested name against the closed set before touching the filesystem
- Return `DOCUMENT_NOT_SERVABLE` for anything else instead of the file or a filesystem error
suggested_fix: Serve only the closed set; answer anything else with `DOCUMENT_NOT_SERVABLE`
