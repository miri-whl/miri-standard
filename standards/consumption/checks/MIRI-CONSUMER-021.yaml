# MIRI-CONSUMER-021 — generated with the Consumer Conformance profile; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-CONSUMER-021
name: Confines a publisher-authored path before dereferencing it
target: consumer
status: active
added_in: 0.3-draft
level: MUST
category: Untrusted Data
weight: 7
conditional: false
severity:
  default: HIGH
  violation_unit: each publisher-authored path dereferenced outside the package root
short_description: Confines a publisher-authored path before dereferencing it
long_description: Publisher-authored file pointers (`api_index.file`, graph node `file`, `source_file`) have to
  be resolved and confined to the package root before the consumer opens them. Opening a path outside the root,
  following a symbolic link out of the package, or accepting an absolute path or traversal sequence fails the check.
  An escaping pointer is reported as malformed metadata.
rationale: '`api_index.file`, graph node `file`, and `source_file` are all publisher-authored strings, and a pointer
  grants no permission. The adversarial fixture points one of them at a path outside the package. A consumer that
  opens it reads a file the package has no business exposing. The read runs with the consumer''s own filesystem
  privileges. The surface has this obligation for the documents it serves. The same string reaches the consumer,
  and the same discipline applies to it.'
fires_when:
- The consumer opens a path that resolves outside the package root
- The consumer follows a symbolic link out of the package, or accepts an absolute path or traversal sequence
remediation:
- Resolve every pointer against the package root, take the realpath, and require a regular file inside it
- Report an escaping pointer as malformed metadata rather than opening it
suggested_fix: Confine every publisher-authored path to the package root before opening it
references:
- title: Consumption Map §4
  url: consumption-map.md
  type: spec
- title: Discovery Contract §3.2.2
  url: discovery-contract.md
  type: spec
examples:
  violation: Reading greet_adversarial/../../../../etc/passwd for the `greet` implementation…
  compliant: 'The api_index entry for `greet` points outside the package root (../../../../etc/passwd).

    Reporting the pointer as malformed; not opening it.'
urls:
