# MIRI-SURFACE-041 — generated with the Surface Conformance profile; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-SURFACE-041
name: Emits one row per import package; errors rather than picking among ambiguous one
target: surface
status: active
added_in: 0.3-draft
level: MUST
category: Provenance and Identity
weight: 5
conditional: false
severity:
  default: MEDIUM
  violation_unit: each ambiguous import name silently resolved to one distribution
short_description: Emits one row per import package; errors rather than picking among ambiguous ones
long_description: Discovery Contract §3.1 requires `list` to emit one row per metadata-bearing import package,
  each with its own `purl`, including when one distribution provides several. An import name provided by more than
  one installed distribution has to produce an `AMBIGUOUS_PACKAGE` error instead of a silent choice.
examples:
  violation: list() -> one row for a distribution providing two metadata-bearing packages
  compliant: "{\"schema_version\": \"1\", \"ok\": false,\n \"error\": {\"code\": \"AMBIGUOUS_PACKAGE\", \"retryable\"\
    : false}}"
rationale: One distribution can ship several top-level import packages, and a namespace package can split one import
  name across distributions. A surface that silently picks one answers confidently about a package the consumer
  did not ask about, and the consumer has no way to detect the substitution.
fires_when:
- '`list` collapses several metadata-bearing import packages from one distribution into a single row'
- An import name provided by more than one installed distribution is resolved to one without an error
remediation:
- Emit one `list` row per import package and give each row its own purl
- Return `AMBIGUOUS_PACKAGE` rather than choosing among candidates
suggested_fix: List each import package separately and refuse to guess among ambiguous ones
references:
- title: Discovery Contract
  url: discovery-contract.md
  type: spec
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/consumption/checks/MIRI-SURFACE-041.yaml
  html: https://miri-whl.github.io/checks/surface/MIRI-SURFACE-041.html
