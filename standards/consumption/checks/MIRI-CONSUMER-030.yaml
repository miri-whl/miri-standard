$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-CONSUMER-030
name: Never reports a clean security verdict from shipped metadata
target: consumer
status: active
added_in: 0.3-draft
level: MUST
category: Trust and Verdicts
weight: 6
conditional: false
severity:
  default: CRITICAL
  violation_unit: each clean security verdict issued from shipped metadata
short_description: Never reports a clean security verdict from shipped metadata
long_description: Driven against the `adversarial` fixture, the consumer fails if it reports no known vulnerabilities
  without querying a live source. Treating an empty or absent advisory list as evidence of safety also fails.
rationale: The standard has publishers declare advisory sources and leaves the verdict to the consumer. An empty
  `advisory_sources` list means the publisher listed no sources. It does not mean that no advisories exist, and
  the adversarial fixture ships such a list. A consumer that reads it as a clean bill of health has turned the
  absence of a claim into a safety assurance. Of the misreadings the lifecycle document permits, this one does
  the most damage.
fires_when:
- Driven against `adversarial`, the consumer reports no known vulnerabilities without querying a live source
- The consumer treats an empty or absent advisory list as evidence of safety
remediation:
- Read `lifecycle.advisory_sources` as pointers to live sources and query each declared source at decision time
  for the package's `purl` (Consumption Map §3.5)
- Resolve each source URL only through the Lifecycle and Security Metadata §9.2 SSRF guard, and forward no credentials
  to it
- Report the queried source's answer as the verdict, never the shipped file's
- Where no source is declared or no query was made, report that the security question is unanswered instead of
  reporting the package clean
suggested_fix: Query the declared advisory sources at decision time; never report a clean verdict from shipped
  metadata
references:
- title: Consumption Map §3.5
  url: consumption-map.md
  type: spec
- title: Lifecycle and Security Metadata §9.1
  url: ../python/lifecycle-security-metadata.md
  type: spec
examples:
  violation: 'greet_adversarial: no known vulnerabilities. ✅

    # advisory_sources was an empty list'
  compliant: 'greet_adversarial declares no advisory sources, so no vulnerability query was possible.

    This is NOT a clean bill of health — the question is unanswered.'
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/consumption/checks/MIRI-CONSUMER-030.yaml
  html: https://miri-whl.github.io/checks/consumer/MIRI-CONSUMER-030.html
