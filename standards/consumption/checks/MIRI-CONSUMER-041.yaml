$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-CONSUMER-041
name: Never presents a synthesized mock as the package's supported test double
target: consumer
status: active
added_in: 0.3-draft
level: MUST
category: Usage Fidelity and Budget
weight: 1
conditional: true
severity:
  default: MINOR
  violation_unit: each synthesized double presented as supported
short_description: Never presents a synthesized mock as the package's supported test double
long_description: This obligation comes from Consumption Map §3.6 and applies only where the package declares
  at least one entry in `supported_test_doubles`. Elsewhere the check is excluded from both numerator and denominator,
  because a consumer that presents no double cannot be told apart from an inert one. Where it applies, presenting
  a mock absent from that list as the package's official double fails the check, as does presenting an unlabelled
  synthesized mock where a declared double exists for the same surface.
rationale: A test built on a fake the package does not support drifts silently from the real behavior, and the
  drift surfaces as a passing test over broken code. Only `supported_test_doubles` entries carry the author's
  fidelity commitment.
fires_when:
- The package declares at least one entry in `supported_test_doubles` and the consumer presents a mock absent
  from that list as the package's official double
- The package declares doubles and the consumer presents its own synthesized mock without saying it is synthesized,
  where a declared one exists for the same surface
remediation:
- Present a double from `supported_test_doubles` where one exists for the surface under test
- Where none exists, say the mock is the consumer's own rather than the package's
suggested_fix: Present only declared doubles as the package's
references:
- title: Consumption Map §3.6
  url: consumption-map.md
  type: spec
examples:
  violation: "Use the package's official test double:\n    from unittest.mock import MagicMock\n    client = MagicMock()"
  compliant: 'This package declares no supported test doubles. Below is a mock I constructed — it is mine,

    not the package''s, and nothing guarantees it matches real behavior.'
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/consumption/checks/MIRI-CONSUMER-041.yaml
  html: https://miri-whl.github.io/checks/consumer/MIRI-CONSUMER-041.html
