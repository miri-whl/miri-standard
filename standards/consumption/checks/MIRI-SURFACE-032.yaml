# MIRI-SURFACE-032 — generated with the Surface Conformance profile; canonical source of truth.
$schema: https://miri-whl.github.io/schemas/check-v3.json
id: MIRI-SURFACE-032
name: Distinguishes an absent `api-index` from an empty one
target: surface
status: active
added_in: 0.3-draft
level: MUST
category: Bounded Answers
weight: 6
conditional: false
severity:
  default: MEDIUM
  violation_unit: each api-index absence signalled as an empty entries object
short_description: Distinguishes an absent `api-index` from an empty one
long_description: 'Discovery Contract §4.2.1 makes `api-index` absent when its parent `sdk-manifest.json` is absent.
  A package that ships no manifest has to get `present: false` with no `entries` key. A `query` that matches nothing
  in an existing manifest has to get `present: true` with an empty `entries`.'
examples:
  violation: '{"ok": true, "present": true, "entries": {}}   # package ships no sdk-manifest.json'
  compliant: "{\"schema_version\": \"1\", \"ok\": true, \"present\": false, \"package\": \"greet_bare\",\n \"reason\"\
    : \"package ships no sdk-manifest.json\"}"
rationale: '`entries: {}` says the package''s surface, as filtered, is empty. That is a statement about the package.
  `present: false` says there is no manifest to derive an index from. A consumer cannot recover the difference
  once the two are collapsed. Reading the former as the latter is the absence-implies-non-existence inference the
  contract forbids elsewhere.'
fires_when:
- 'A package shipping no `sdk-manifest.json` gets `present: true` with an empty `entries`'
- 'A `query` matching nothing returns `present: false` rather than an empty `entries`'
remediation:
- 'Return `present: false` with no `entries` key when the manifest is absent'
- 'Return `present: true` with an empty `entries` when the manifest exists and the filter matched nothing'
suggested_fix: Keep an absent `api-index` distinct from an empty one
references:
- title: Discovery Contract
  url: discovery-contract.md
  type: spec
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/consumption/checks/MIRI-SURFACE-032.yaml
  html: https://miri-whl.github.io/checks/surface/MIRI-SURFACE-032.html
