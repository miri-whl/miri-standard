# MIRI-CONSUMER-042 — generated with the Consumer Conformance profile; canonical source of truth.
id: MIRI-CONSUMER-042
name: Never presents a whole-document retrieval as a derived view
target: consumer
status: active
added_in: 0.3-draft
level: SHOULD
category: Usage Fidelity and Budget
weight: 1
conditional: false
severity:
  default: LOW
  violation_unit: each whole-document retrieval reported as a scoped answer
short_description: Never presents a whole-document retrieval as though a derived view had been used
long_description: Budget preference, graded separately from the correctness MUSTs. Restated as an output claim because
  which operation a consumer called is a request-side fact the profile's verification model cannot observe (§2);
  what it can observe is the claim the consumer makes about what it read.
rationale: This is a budget preference, not a correctness rule, and is graded separately as such. Retrieving a large
  document to use one part of it is the behavior the derived views were added to make unnecessary.
fires_when:
- The consumer's output claims a filtered or routing view was used when the whole document was retrieved
- The consumer reports a document's full contents as though they were a scoped answer to the question asked
remediation:
- Use `api-index`, `patterns`, or `graph` where the question is a routing, pattern, or relationship question
suggested_fix: Use `api-index`, `patterns`, or `graph` where the question is a routing, pattern, or relationship
  question
references:
- title: Discovery Contract §3.2.3
  url: discovery-contract.md
  type: spec
examples:
  violation: 'document(package="pandas", name="sdk-manifest.json")   # 400 KB retrieved to find one symbol'
  compliant: 'api-index(package="pandas", query="read_csv")   # routing view, capped'
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/consumption/checks/MIRI-CONSUMER-042.yaml
  html: https://miri-whl.github.io/checks/consumer/MIRI-CONSUMER-042.html
