# MIRI-CONSUMER-042 — generated with the Consumer Conformance profile; canonical source of truth.
id: MIRI-CONSUMER-042
name: Prefers a derived view over retrieving a whole document
target: consumer
status: active
added_in: 0.3-draft
level: SHOULD
category: Usage Fidelity and Budget
weight: 1
conditional: false
severity:
  default: LOW
  violation_unit: each whole-document retrieval where a derived view would answer
short_description: Prefers a derived view over retrieving a whole document
long_description: This check verifies the consumer uses the filtered operations where they answer the question,
  rather than retrieving a whole document and filtering client-side.
rationale: This is a budget preference, not a correctness rule, and is graded separately as such. Retrieving a large
  document to use one part of it is the behavior the derived views were added to make unnecessary.
fires_when:
- The consumer retrieves a whole document where a derived view with an available filter would have answered the
  question
remediation:
- Use `api-index`, `patterns`, or `graph` where the question is a routing, pattern, or relationship question
suggested_fix: Use `api-index`, `patterns`, or `graph` where the question is a routing, pattern, or relationship
  question
references:
- title: Discovery Contract §3.2.3
  url: discovery-contract.md
  type: spec
examples:
  violation: 'document(package="pandas", name="sdk-manifest.json")   # 400 KB retrieved to find one symbol'
  compliant: 'api-index(package="pandas", query="read_csv")   # routing view, capped'
urls:
  definition: https://github.com/miri-whl/miri-standard/blob/main/standards/consumption/checks/MIRI-CONSUMER-042.yaml
  html: https://miri-whl.github.io/checks/miri-consumer-042/
