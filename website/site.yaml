# Site configuration — data consumed by tools/generate_site.py (schema-as-data: content
# comes from the check YAMLs and docs/, structure comes from here, look comes from
# static/css/, markup comes from templates/).
github: https://github.com/miri-whl/miri-standard
site_url: https://miri-whl.github.io
version: 0.5.0
status_badge: Incubation

targets:
  python:
    dir: standards/python/checks
    title: Python wheels
    prefix: MIRI-PY
    checklist: standards/python/linter-checklist.md
  cli:
    dir: standards/cli/checks
    title: Command-line tools
    prefix: MIRI-CLI
    checklist: standards/cli/linter-checklist.md
  consumer:
    dir: standards/consumption/checks
    match: consumer
    title: Metadata consumers
    prefix: MIRI-CONSUMER
    checklist: standards/consumption/consumer-conformance.md
  surface:
    dir: standards/consumption/checks
    match: surface
    title: Metadata surfaces
    prefix: MIRI-SURFACE
    checklist: standards/consumption/surface-conformance.md

# Specification documents rendered as site pages (source of truth stays the markdown).
specs:
  - source: standards/consumption/discovery-contract.md
    title: Discovery Contract
    status: 0.3-draft
    lede: How a package's metadata reaches an agent at the moment it decides what to call.
  - source: standards/consumption/consumption-map.md
    title: Consumption Map
    status: 0.3-draft
    lede: What to read, per task, in what order — and what not to do with it.
  - source: standards/consumption/consumer-conformance.md
    title: Consumer Conformance
    status: 0.3-draft
    lede: What a conformant consumer is, and how it is verified by being driven rather than inspected.
  - source: standards/consumption/surface-conformance.md
    title: Surface Conformance
    status: 0.3-draft
    lede: What a conformant metadata-query surface is — the obligations a consumer cannot be held to.
  - source: standards/python/production-map.md
    title: Production Map
    status: 0.5.0-draft
    lede: The Consumption Map says what a consumer reads and in what order. This says what an author builds, and in what order.

  - source: standards/consumption/agent-integration-contract.md
    title: Agent Integration Contract
    status: 0.4.0-draft
    lede: The Consumption Map says what to read and in what order. This says when the reading starts.

# Sidebar navigation. href is site-relative; external links are absolute; planned rows
# are inert (the repo's rule: planned documents are listed as plain text, never linked).
nav:
  - label: Project
    items:
      - { label: Overview, href: index.html }
      - { label: Why consumption, href: why-consumption.html }
      - { label: Glossary, href: glossary.html }
      - { label: Changelog, href: changelog.html }
      - { label: Origin story, href: origin.html }
  - label: Python
    items:
      - { label: Check definitions, href: checks/python/index.html }
      - { label: Production map, href: production-map.html }
      - { label: "Linter checklist ↗", href: "https://github.com/miri-whl/miri-standard/blob/main/standards/python/linter-checklist.md" }
      - { label: Agent metadata schema, planned: true }
  - label: CLI
    items:
      - { label: Check definitions, href: checks/cli/index.html }
      - { label: "Linter checklist ↗", href: "https://github.com/miri-whl/miri-standard/blob/main/standards/cli/linter-checklist.md" }
      - { label: Introspection schema, planned: true }
  - label: Consumption
    items:
      - { label: "Consumer checks", href: checks/consumer/index.html }
      - { label: "Surface checks", href: checks/surface/index.html }
      - { label: Discovery contract, href: discovery-contract.html }
      - { label: Consumption map, href: consumption-map.html }
      - { label: Consumer conformance, href: consumer-conformance.html }
      - { label: Surface conformance, href: surface-conformance.html }
      - { label: Agent integration, href: agent-integration-contract.html }
      - { label: "Originating RFC (superseded) ↗", href: "https://github.com/miri-whl/miri-standard/blob/main/proposals/20260821-consumption-specification.md" }
  - label: Go / Rust
    items:
      - { label: "Go scope sketch ↗", href: "https://github.com/miri-whl/miri-standard/blob/main/standards/go/README.md" }
      - { label: "Rust scope sketch ↗", href: "https://github.com/miri-whl/miri-standard/blob/main/standards/rust/README.md" }

# Assets copied from assets/img/ into the published site.
assets:
  - miri-grey.png
  - miri-green.png
  - mira-16.png
