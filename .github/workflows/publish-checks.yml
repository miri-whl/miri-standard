name: Publish check definitions

# The check definitions as a data-only wheel, attached to a GitHub Release at every release tag.
# The repository stays the source of truth; the wheel is a derived output, like the site, and is
# gated by the same validators before it is built. Hosted on GitHub Releases for now; an index
# (PyPI, trusted publishing) is a later step and this job is the one that would grow it.
#
# This artifact is a supply-chain root: a poisoned definitions package weakens every linter that
# installs it. So the build attests its provenance (actions/attest-build-provenance) and publishes a
# SHA256SUMS beside the wheel, and the manifest inside the wheel pins the commit and a content hash.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      republish_tag:
        description: 'Existing release tag whose index to republish (takes the digest from the release, does not rebuild)'
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    name: Build wheel and attach to release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml jsonschema build

      - name: Gate the tree before building from it
        run: |
          make validate
          make consistency

      - name: Build the wheel
        run: make checks-wheel

      # Dogfooding, and it GATES: the definitions wheel is a wheel, so the reference linter scores it, and a
      # failing MUST stops the release. The standard's own artifact is held to the standard it carries.
      # This was advisory until the wheel earned it - it shipped no agent-metadata and named a release page as
      # its registry, which miri-py 0.6.0 correctly rejects. Both closed; it now scores 98 of 53.0 with zero
      # MUST failures. A non-conforming definitions package must never reach the release page: it is what
      # every downstream linter installs to learn what the rules are.
      # miri-py is installed best-effort exactly as ci.yml does; when unreachable the step is skipped, not failed.
      - name: Install miri-py (best-effort)
        id: miripy
        continue-on-error: true
        env:
          MIRI_PY_TOKEN: ${{ secrets.MIRI_PY_TOKEN }}
          MIRI_PY_REF: ${{ vars.MIRI_PY_REF }}
        # Pinned to a REF, not to main. main predates the MIRI-PY-020 fix, so the gate would have
        # installed a linter that passes the release-page registry it was mutation-tested against -
        # a gate that cannot catch its own regression test. MIRI_PY_REF is set to a tag or sha once
        # miri-py publishes one; until then this tracks the branch carrying the 0.6.0 fixes.
        run: |
          REF="${MIRI_PY_REF:-phase-0.6-stage-2}"
          pip install "git+https://${MIRI_PY_TOKEN}@github.com/miri-whl/miri-py.git@${REF}"

      - name: Score the wheel with the reference linter (gates the release)
        if: steps.miripy.outcome == 'success'
        run: python3 tools/score_wheel.py .generated/checks-wheel/dist/*.whl

      - name: Note skipped score
        if: steps.miripy.outcome != 'success'
        run: echo "::notice::miri-py unavailable - the definitions wheel was not scored this run."

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .generated/checks-wheel/dist/*.whl

      - name: Attach to the release for this tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Miri Standard ${GITHUB_REF_NAME}" \
            --generate-notes \
            .generated/checks-wheel/dist/*.whl \
            .generated/checks-wheel/dist/SHA256SUMS \
          || gh release upload "${GITHUB_REF_NAME}" --clobber \
            .generated/checks-wheel/dist/*.whl \
            .generated/checks-wheel/dist/SHA256SUMS

      # The index is generated by publish-site.yml on push to main, BEFORE any tag exists, so it can
      # never carry the release hash on its own - it would publish `hashes: {}` and every integrity
      # mechanism the Downloads page offers would be irrelevant to the one command that installs the
      # artifact. Regenerating the site HERE, after the wheel and its SHA256SUMS exist, is what lets
      # the generator put a real sha256 in the index and a #sha256= fragment on the anchor.
      - name: Republish the site so the index carries the wheel's hash
        if: github.event_name == 'push'
        run: |
          pip install jinja2
          make site OUT=site
          python3 tools/generate_site.py --out site

      # The secret is MIRI_SITE_PUBLISH_TOKEN — the same one publish-site.yml has deployed with since 0.3.
      # This step named a PAGES_TOKEN that has never existed, so the very first release built the wheel,
      # attached it, and then failed here with "not found deploy key or tokens", leaving the index on the
      # hashless copy publish-site.yml had written before any tag existed. A secret name is not type-checked
      # by anything: an undefined one expands to empty and the action reports a missing key, not a missing name.
      - name: Deploy the rehashed index
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.MIRI_SITE_PUBLISH_TOKEN }}
          external_repository: miri-whl/miri-whl.github.io
          publish_branch: main
          publish_dir: ./site

      - name: Keep the wheel as a workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: miri-standard-checks
          path: |
            .generated/checks-wheel/dist/*.whl
            .generated/checks-wheel/dist/SHA256SUMS

  # Republishing the index for a tag that is already released, without rebuilding. Needed because the
  # wheel is not byte-reproducible - setuptools is unpinned and the manifest carries `generated_at` - so a
  # rebuilt wheel's digest would not describe the asset the index links to. The digest therefore comes from
  # the release's own SHA256SUMS. Run this from main with `republish_tag: <tag>` when a release published
  # but its index deploy did not, which is exactly what happened at 0.7.0.
  republish-index:
    name: Republish the index for an existing release
    if: github.event_name == 'workflow_dispatch' && inputs.republish_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.republish_tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml jsonschema jinja2

      - name: Take the digest from the published release, never from a rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .generated/checks-wheel/dist
          gh release download "${{ inputs.republish_tag }}" -p SHA256SUMS -D .generated/checks-wheel/dist
          cat .generated/checks-wheel/dist/SHA256SUMS

      - name: Generate the site with that digest in the index
        run: |
          python3 tools/generate_site.py --out site
          grep -q 'sha256' site/simple/miri-standard-checks/index.json
          grep -q '#sha256=' site/simple/miri-standard-checks/index.html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.MIRI_SITE_PUBLISH_TOKEN }}
          external_repository: miri-whl/miri-whl.github.io
          publish_branch: main
          publish_dir: ./site
          commit_message: 'site: republish index for ${{ inputs.republish_tag }}'
