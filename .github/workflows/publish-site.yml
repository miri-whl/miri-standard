name: Publish Site

# Regenerates the site from the canonical check definitions and publishes
# it to the Pages repository whenever check definitions or the generator change
# on main. The site is never committed here — the YAML files are the source of
# truth and the site is a derived artifact (schema-as-data rule).

on:
  push:
    branches: [main]
    paths:
      # Any target's checks, so a new suite does not silently stop triggering a publish
      # (consumption was added in 0.3 and would not have matched the per-target list).
      - 'standards/*/checks/**'
      - 'schemas/**'
      - 'docs/*.md'
      - 'website/**'
      - 'tools/generate_site.py'
      # The generator also renders the changelog and the spec pages listed in website/site.yaml;
      # without these two, a changelog-only or spec-only merge left the published site stale.
      - 'CHANGELOG.md'
      - 'standards/*/*.md'
      # This workflow itself, so a fix to it republishes rather than leaving the last failure standing.
      - '.github/workflows/publish-site.yml'
  workflow_dispatch:

jobs:
  publish:
    name: Generate and Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml jsonschema jinja2

      - name: Validate check definitions against schema
        run: |
          # One validator, in the Makefile. This step used to carry its own copy of it with the schema
          # path hard-coded, so the 0.6.0 bump to check-v3 repointed Makefile, hook and prose and never
          # reached here: the first publish after the merge failed on `$schema` const. A copy is a fork.
          make validate

      # Every site publish regenerates simple/ and the deploy replaces the whole directory, so without a
      # SHA256SUMS beside the generator this job republishes `hashes: {}` and silently undoes the digest
      # the release job wrote. That is not hypothetical: it is how the index came to be hashless while a
      # released wheel existed. Fetching the newest release's sums makes a docs merge unable to un-verify
      # the published wheel. Best-effort by design — before the first release there is nothing to fetch,
      # and the site must still publish. The generator never fabricates a digest, so a miss stays empty.
      - name: Carry the published wheel's digest into the index
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .generated/checks-wheel/dist
          gh release download --pattern SHA256SUMS -D .generated/checks-wheel/dist || true
          cat .generated/checks-wheel/dist/SHA256SUMS 2>/dev/null || echo "::notice::no published release yet - index will carry no hash"

      - name: Generate site
        run: python3 tools/generate_site.py --out site

      - name: Publish to Pages repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Fine-grained PAT with contents:write on the target repo,
          # stored as the MIRI_SITE_PUBLISH_TOKEN repository secret.
          personal_token: ${{ secrets.MIRI_SITE_PUBLISH_TOKEN }}
          # For https://miri-whl.github.io/checks/... URLs (no repo prefix),
          # the target repo must be named miri-whl.github.io.
          external_repository: miri-whl/miri-whl.github.io
          publish_branch: main
          publish_dir: ./site
          commit_message: 'site: regenerate from ${{ github.sha }}'
